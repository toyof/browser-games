<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taiko Beat</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b16;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:flex-end;justify-content:center;height:100dvh}
  canvas{display:block;margin:0 auto;width:min(100vw,calc((100dvh - 44px)*2/3));height:auto;aspect-ratio:2/3;background:#10101f;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script src="songs/songs.js"></script>
<script>
"use strict";
// ============ 設定 ============
const CFG = {
  bpm: 128,
  bars: 32,
  leadBeats: 8,
  windows: { perfect: 0.045, great: 0.090, good: 0.135 },
  score: { perfect: 1000, great: 700, good: 400 },
  speed: 480,          // px/秒
  flowDown: true,      // true: 上→下 / false: 下→上
  offset: 0,
};
// 2レーン: 左ボタン(F / D / ←)と右ボタン(J / K / →)が1つずつ
const KEY_LANE = { KeyF:0, KeyD:0, ArrowLeft:0, KeyJ:1, KeyK:1, ArrowRight:1 };

const RED = "#ff4a3d", BLUE = "#3d9bff", ROLL = "#ffd24d", LANE_COL = [RED, BLUE];
const LEVELS = [
  { name:"かんたん", star:1, color:"#6dff7a", win:1.3, speed:420, desc:"2拍に1回",     rolls:[15,23] },
  { name:"ふつう",   star:3, color:"#4dc3ff", win:1.1, speed:480, desc:"4分音符+連打",  rolls:[11,19,27] },
  { name:"むずかしい", star:5, color:"#ffd24d", win:1.0, speed:540, desc:"8分まじり+連打", rolls:[7,15,23,27] },
  { name:"鬼",       star:8, color:"#ff4a3d", win:0.8, speed:600, desc:"8分連打+長い連打", rolls:[7,11,15,19,23,27] },
];
let level = 1;
const BASE_WIN = { perfect:0.045, great:0.090, good:0.135 };
function applyLevel(){ const L = LEVELS[level]; for(const k in BASE_WIN) CFG.windows[k] = BASE_WIN[k]*L.win; }

const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = cv.width, H = cv.height;
const LANE_XS = [W/2-70, W/2+70], LANE_X = W/2, R = 34;   // 左右2レーン(LANE_Xは中央)
const LANE_W = 112, SIDE_X = [56, W-56];                   // レーン幅 / 脇のキャラの位置
const HIT_Y = () => CFG.flowDown ? H-190 : 190;
let songIdx = 0;
const song = () => SONGS[songIdx];

// ============ 譜面(dance/tools/build_songs.py が曲から自動生成 → songs/songs.js) ============
function buildChart(){
  const S = song(), L = S.levels[level], step = 60 / S.bpm / 4;   // 16分音符の長さ
  const notes = [];
  for(const [k,lane] of L.n) notes.push({ kind:"note", lane, t:S.offset + k*step, hit:false, judged:false });
  for(const [k,len] of L.r){
    const t = S.offset + k*step;
    notes.push({ kind:"roll", t, end:t + len*step, hits:0, judged:false, hit:false });
  }
  notes.sort((a,b)=>a.t-b.t);
  return notes;
}

// ============ 音 ============
// 曲: songs/*.mp3 (FreePD.com, CC0/Public Domain) を decodeAudioData で再生。
// ヒット音: ドン(左・低い太鼓) / カッ(右・縁の高い音) を Web Audio で合成。
let ac = null, master = null, musicGain = null, songStart = 0, songLen = 0, nb = null, musicSrc = null;
const bufCache = {}; let loadError = "";
function initAudio(){
  if(ac) return;
  ac = new (window.AudioContext||window.webkitAudioContext)();
  nb = ac.createBuffer(1, ac.sampleRate*0.3, ac.sampleRate);
  const d = nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
async function loadSong(i){
  const id = SONGS[i].id;
  if(bufCache[id]) return bufCache[id];
  const res = await fetch(`songs/${id}.mp3`);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const buf = await ac.decodeAudioData(await res.arrayBuffer());
  return bufCache[id] = buf;
}
function noiseHit(t, dur, freq, vol, type, q=1){
  const s=ac.createBufferSource(); s.buffer=nb;
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const v=ac.createGain(); v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f).connect(v).connect(master); s.start(t); s.stop(t+dur+0.02);
}
function songTime(){ return ac.currentTime - songStart - CFG.offset; }
function sfx(lane){   // 0=ドン(低く太い) / 1=カッ(縁を叩く高い音)
  if(!ac||!master) return;
  const t=ac.currentTime;
  if(lane===0){
    const o=ac.createOscillator(), v=ac.createGain();
    o.type="sine"; o.frequency.setValueAtTime(210,t); o.frequency.exponentialRampToValueAtTime(75,t+0.12);
    v.gain.setValueAtTime(1.0,t); v.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(v).connect(master); o.start(t); o.stop(t+0.25);
    noiseHit(t,0.04,900,0.35,"lowpass");
  } else {
    const o=ac.createOscillator(), v=ac.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(900,t+0.05);
    v.gain.setValueAtTime(0.5,t); v.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.connect(v).connect(master); o.start(t); o.stop(t+0.1);
    noiseHit(t,0.06,3800,0.8,"bandpass",1.5);
  }
}

// ============ ゲーム状態 ============
let state = "title"; // title | play | pause | result
let notes = [], score, combo, maxCombo, counts, rollTotal, lastJudge = null, flash = [0,0], held = {};
let frameN = 0, lastPress = [-99,-99];   // フレーム数(パラパラ用) / 各レーンが最後に叩かれたフレーム
async function start(){
  if(state==="loading") return;
  initAudio();
  if(ac.state!=="running") ac.resume();      // ユーザー操作の中で呼ぶ(iOS対策)
  if(musicSrc){ try{ musicSrc.stop(); }catch(e){} musicSrc=null; }
  if(master) master.disconnect();
  loadError = "";
  let buf;
  if(!bufCache[song().id]){
    state="loading";
    try{ buf = await loadSong(songIdx); }
    catch(e){ loadError = "曲を読み込めませんでした(file:// では動きません。サーバー経由で開いてください)"; state="title"; return; }
  } else buf = bufCache[song().id];
  master = ac.createGain(); master.gain.value=0.8; master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value=0.7; musicGain.connect(master);
  applyLevel(); CFG.speed = LEVELS[level].speed;
  notes = buildChart(); score=0; combo=0; maxCombo=0; lastJudge=null; rollTotal=0;
  counts={perfect:0,great:0,good:0,miss:0};
  songStart = ac.currentTime + 1.5;          // 曲の頭の前に1.5秒のカウントイン
  songLen = song().dur;
  musicSrc = ac.createBufferSource(); musicSrc.buffer = buf; musicSrc.connect(musicGain); musicSrc.start(songStart);
  state = "play";
}
function toTitle(){
  if(musicSrc){ try{ musicSrc.stop(); }catch(e){} musicSrc=null; }
  if(master){ master.disconnect(); master=null; }
  if(ac) ac.resume();
  state="title";
}
function judge(kind, lane=0){
  counts[kind]++; lastJudge = { kind, lane, t: performance.now() };
  if(kind==="miss") combo=0; else { combo++; maxCombo=Math.max(maxCombo,combo); score += CFG.score[kind] + Math.min(combo,100)*5; }
}
function activeRoll(now){ return notes.find(n=> n.kind==="roll" && now>=n.t-0.05 && now<=n.end); }
function press(lane){
  if(state!=="play") return;
  flash[lane]=1; lastPress[lane]=frameN;
  const now = songTime();
  const roll = activeRoll(now);
  if(roll){ roll.hits++; rollTotal++; score += 300; sfx(lane); return; }   // 連打中は左右どちらでも加点
  let best=null, bd=1e9;
  for(const n of notes){
    if(n.judged || n.kind!=="note" || n.lane!==lane) continue;
    if(n.t-now > CFG.windows.good) break;
    const d = Math.abs(n.t-now);
    if(d<bd){ bd=d; best=n; }
  }
  if(!best || bd>CFG.windows.good) return;
  best.judged=true; best.hit=true;
  judge(bd<=CFG.windows.perfect?"perfect": bd<=CFG.windows.great?"great":"good", lane);
  sfx(lane);
}
function update(){
  if(state!=="play") return;
  const now = songTime();
  for(const n of notes){
    if(n.judged) continue;
    if(n.kind==="note" && now - n.t > CFG.windows.good){ n.judged=true; judge("miss", n.lane); }
    else if(n.kind==="roll" && now > n.end){ n.judged=true; }
  }
  if(now > songLen + 1) finish();
}
function finish(){
  state="result";
  const total = notes.filter(n=>n.kind==="note").length;
  const r = counts.perfect*1 + counts.great*0.7 + counts.good*0.4;
  const acc = total? r/total : 0;
  window.rank = acc>=0.95?"S": acc>=0.85?"A": acc>=0.7?"B":"C";
  window.acc = acc;
  try{ if(score > (+localStorage.getItem("taikoHi")||0)) localStorage.setItem("taikoHi", score); }catch(e){}
}

// ============ 入力 ============
function changeLevel(i){ level=(i+LEVELS.length)%LEVELS.length; CFG.speed=LEVELS[level].speed; }
function pause(){ if(state==="play"){ state="pause"; ac.suspend(); } }
function resume(){ if(state==="pause"){ state="play"; ac.resume(); } }
addEventListener("keydown", e=>{
  if(e.repeat) return;
  if(state==="play" && e.code in KEY_LANE){ e.preventDefault(); held[e.code]=true; press(KEY_LANE[e.code]); return; }
  if(state==="title"||state==="result"){
    if(e.code==="ArrowLeft"||e.code==="ArrowUp"){ e.preventDefault(); changeLevel(level-1); return; }
    if(e.code==="ArrowRight"||e.code==="ArrowDown"){ e.preventDefault(); changeLevel(level+1); return; }
    const m=/^(Digit|Numpad)([1-4])$/.exec(e.code); if(m){ changeLevel(+m[2]-1); return; }
    if(e.code==="KeyS"){ songIdx=(songIdx+1)%SONGS.length; return; }
    if(e.code==="Enter"||e.code==="Space"){ e.preventDefault(); start(); return; }
    if(state==="result" && (e.code==="KeyT"||e.code==="Escape")){ toTitle(); return; }
  }
  if(e.code==="Escape"){ if(state==="play") pause(); else if(state==="pause") resume(); return; }
  if(state==="pause"){
    if(e.code==="KeyR"){ ac.resume(); start(); }
    if(e.code==="KeyT"){ toTitle(); }
  }
  if(state==="title"||state==="pause"){
    if(e.code==="BracketLeft") CFG.offset=+(CFG.offset-0.01).toFixed(3);
    if(e.code==="BracketRight") CFG.offset=+(CFG.offset+0.01).toFixed(3);
    if(e.code==="Minus") CFG.speed=Math.max(240,CFG.speed-40);
    if(e.code==="Equal") CFG.speed=Math.min(900,CFG.speed+40);
    if(e.code==="KeyH") CFG.flowDown=!CFG.flowDown;
  }
});
addEventListener("keyup", e=>{ delete held[e.code]; });

let buttons = [];
function button(label,x,y,w,h,fn,color="#ffffff22",tc="#fff"){
  buttons.push({x,y,w,h,fn});
  g.fillStyle=color; g.fillRect(x,y,w,h);
  g.strokeStyle="rgba(255,255,255,.5)"; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  text(label,x+w/2,y+h/2+6,Math.min(18,h*0.5),tc);
}
function pointer(e){
  const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)*W/r.width, py=(e.clientY-r.top)*H/r.height;
  for(const b of buttons) if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){ b.fn(); return true; }
  return false;
}
cv.addEventListener("pointerdown", e=>{
  if(pointer(e)) return;
  if(state==="play"){   // タップでも叩ける(画面の左半分=左レーン、右半分=右レーン)
    const r=cv.getBoundingClientRect(), lane=(e.clientX-r.left)<r.width/2 ? 0 : 1, k="pointer"+lane;
    press(lane); held[k]=true; setTimeout(()=>delete held[k],100);
  }
});

// ============ 描画 ============
function text(s,x,y,size,color="#fff",align="center"){ g.fillStyle=color; g.font=`bold ${size}px system-ui,sans-serif`; g.textAlign=align; g.fillText(s,x,y); }
function drum(x,y,alpha=1,dim=false,r=R,col=RED){
  g.globalAlpha=alpha;
  g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=dim?"#555":col; g.fill();
  g.lineWidth=6*r/R; g.strokeStyle="#fff"; g.stroke();
  g.beginPath(); g.arc(x,y,r*0.45,0,Math.PI*2); g.fillStyle=dim?"#777":"#ffd0c8"; g.fill();
  g.globalAlpha=1;
}
// ---- パラパラアニメ: 8フレームごとに次のコマへ切り替わる(4コマの繰り返し) ----
const FLIP_FRAMES = 8;
function dancer(x, y, side, f, hit, now){
  const yy = y + (f%2 ? -8 : 0);                       // コマごとに弾む
  const col = side ? "#4dc3ff" : "#ff8a4d";
  // 脚(コマで開閉)
  g.strokeStyle="#ddd"; g.lineWidth=7; g.lineCap="round";
  const sp = f<2 ? 10 : 22;
  g.beginPath(); g.moveTo(x-8,yy+32); g.lineTo(x-sp,yy+62); g.moveTo(x+8,yy+32); g.lineTo(x+sp,yy+62); g.stroke();
  // 胴
  g.fillStyle=col; g.beginPath(); g.roundRect(x-17,yy-10,34,46,8); g.fill();
  // 腕と撥(コマごとに 上→中→下→中。左右の腕は2コマずらす)
  const ang = [-1.0,-0.2,0.9,-0.2];
  for(const s of [-1,1]){
    const a = hit ? 0.9 : ang[(f + (s>0?2:0))%4];
    const sx = x+s*17, sy = yy-2, c=Math.cos(a)*s, d=Math.sin(a);
    const hx=sx+c*32, hy2=sy+d*32;
    g.strokeStyle=col; g.lineWidth=9; g.beginPath(); g.moveTo(sx,sy); g.lineTo(hx,hy2); g.stroke();
    g.strokeStyle="#ffd24d"; g.lineWidth=5; g.beginPath(); g.moveTo(hx,hy2); g.lineTo(hx+c*22,hy2+d*22); g.stroke();
  }
  // 頭・はちまき・顔
  g.fillStyle="#ffe0b8"; g.beginPath(); g.arc(x,yy-32,21,0,Math.PI*2); g.fill();
  g.fillStyle="#e33"; g.fillRect(x-21,yy-42,42,8);
  g.fillStyle="#222";
  if(hit){ g.fillRect(x-11,yy-30,8,3); g.fillRect(x+3,yy-30,8,3); g.beginPath(); g.arc(x,yy-18,6,0,Math.PI); g.fill(); }  // >< と大きな口
  else { g.beginPath(); g.arc(x-8,yy-28,3,0,7); g.arc(x+8,yy-28,3,0,7); g.fill(); g.fillRect(x-5,yy-17,10,3); }
}
function drawDancers(now){
  const f = Math.floor(frameN/FLIP_FRAMES)%4;
  for(let i=0;i<2;i++){
    const hit = frameN-lastPress[i] < FLIP_FRAMES;     // 叩いた直後は「叩いたポーズ」
    dancer(SIDE_X[i], 250, i, f, hit, now);
    // 音符も2コマで入れ替わる
    text(f%2?"♪":"♫", SIDE_X[i]+(i?-30:30), 170-(f%2?0:10), 26, "#ffd24d");
  }
}
function songSelect(y){
  SONGS.forEach((S,i)=>{
    const x=40+(i%2)*205, yy=y+Math.floor(i/2)*58, sel=i===songIdx;
    buttons.push({x,y:yy,w:195,h:50,fn:()=>{ songIdx=i; }});
    g.fillStyle=sel? S.color : "rgba(255,255,255,0.08)"; g.fillRect(x,yy,195,50);
    text(S.title,x+10,yy+22,16,sel?"#111":"#ccc","left");
    text(`BPM ${S.bpm}`,x+10,yy+41,12,sel?"#222":"#777","left");
  });
}
function levelSelect(y){
  LEVELS.forEach((L,i)=>{
    const yy=y+i*56, sel=i===level;
    buttons.push({x:40,y:yy,w:400,h:50,fn:()=>changeLevel(i)});
    g.fillStyle=sel? L.color : "rgba(255,255,255,0.08)"; g.fillRect(40,yy,400,50);
    text(`${i+1}. ${L.name}`,56,yy+22,18,sel?"#111":"#aaa","left");
    text("★".repeat(Math.min(L.star,5))+(L.star>5?"+":""),56,yy+41,12,sel?"#111":"#777","left");
    text(L.desc,428,yy+31,13,sel?"#222":"#666","right");
  });
}
const settingsLine = () => `音ズレ補正 [ ] : ${(CFG.offset*1000).toFixed(0)}ms   速度 - = : ${CFG.speed}   H: ${CFG.flowDown?"上→下":"下→上"}`;

function draw(){
  buttons = [];
  g.clearRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#2a1020"); gr.addColorStop(1,"#0b0b16");
  g.fillStyle=gr; g.fillRect(0,0,W,H);

  if(state==="title"||state==="loading"){
    text("TAIKO BEAT",W/2,70,42);
    text("曲",40,118,14,"#9ad","left");
    songSelect(128);
    text("むずかしさ",40,262,14,"#9ad","left");
    levelSelect(272);
    button(state==="loading"?"よみこみ中…":"スタート (Enter)",W/2-120,508,240,52,start,RED);
    if(loadError) text(loadError,W/2,580,12,"#ff8a8a");
    else text("左のレーン=ドン(赤) / 右のレーン=カッ(青)。画面の左右タップもOK",W/2,584,13,"#9ad");
    text("黄色い帯は連打(左右どちらでもOK) / キー: 左 F・D・← 右 J・K・→ / S: 曲変更",W/2,608,11,"#aaa");
    text("曲: FreePD.com (CC0 / Public Domain)",W/2,636,11,"#778");
    text(settingsLine(),W/2,690,11,"#889");
    return;
  }
  if(state==="result"){
    text("RESULT",W/2,70,30);
    text(window.rank,W/2,220,130,{S:"#ffd24d",A:"#6dff7a",B:"#4dc3ff",C:"#ccc"}[window.rank]);
    text(`SCORE ${score}`,W/2,285,28);
    text(`MAX COMBO ${maxCombo}   ACC ${(window.acc*100).toFixed(1)}%   連打 ${rollTotal}`,W/2,318,14,"#ccc");
    const rows=[["PERFECT",counts.perfect,"#ffd24d"],["GREAT",counts.great,"#6dff7a"],["GOOD",counts.good,"#4dc3ff"],["MISS",counts.miss,"#ff4d6d"]];
    rows.forEach((r,i)=>{ text(r[0],W/2-10,370+i*34,22,r[2],"right"); text(String(r[1]),W/2+20,370+i*34,22,"#fff","left"); });
    text(`${song().title} / ${LEVELS[level].name}(1〜4 / ← → でレベル、S で曲変更)`,W/2,545,13,"#ccc");
    button("もう一度 (Enter)",W/2-120,565,240,48,start,RED);
    button("タイトルへ (T)",W/2-120,625,240,48,toTitle);
    return;
  }

  const hy=HIT_Y(), dir=CFG.flowDown?1:-1, now=songTime();
  const yOf = t => hy - dir*(t-now)*CFG.speed;
  // 脇のキャラ(パラパラアニメ)
  drawDancers(now);
  // レーン(左右2本)
  const laneFlash = [0,1].map(i=>{ flash[i]=Math.max(0,flash[i]-0.08); return flash[i]; });
  for(let i=0;i<2;i++){
    const lx=LANE_XS[i];
    g.fillStyle="#1b1b24"; g.fillRect(lx-LANE_W/2,0,LANE_W,H);
    g.fillStyle="#2c2c38"; g.fillRect(lx-LANE_W/2,hy-R-14,LANE_W,(R+14)*2);
    g.beginPath(); g.arc(lx,hy,R+4,0,Math.PI*2); g.lineWidth=4; g.strokeStyle="rgba(255,255,255,0.7)"; g.stroke();
    if(laneFlash[i]>0){ g.beginPath(); g.arc(lx,hy,R+4,0,Math.PI*2); g.fillStyle="rgba(255,74,61,"+(laneFlash[i]*0.6)+")"; g.fill(); }
  }
  // 連打ノーツ(帯・左右レーンをまたぐ。どちらのボタンでもOK)
  const rx0=LANE_XS[0]-46, rw=LANE_XS[1]-LANE_XS[0]+92;
  for(const n of notes){
    if(n.kind!=="roll") continue;
    const y1=yOf(n.t), y2=yOf(n.end), top=Math.min(y1,y2), h=Math.abs(y2-y1);
    if(top>H||top+h<0) continue;
    const act = now>=n.t && now<=n.end;
    g.fillStyle=act? "#fff2a8":ROLL; g.fillRect(rx0,top,rw,h);
    g.strokeStyle="#fff"; g.lineWidth=4; g.strokeRect(rx0,top,rw,h);
    text("連打!",LANE_X,top+h/2+6,20,"#7a4d00");
  }
  // 通常ノーツ(奥のものから描く)
  for(let i=notes.length-1;i>=0;i--){
    const n=notes[i]; if(n.kind!=="note"||n.hit) continue;
    const y=yOf(n.t);
    if(y<-R||y>H+R) continue;
    drum(LANE_XS[n.lane],y,1,n.judged,R,LANE_COL[n.lane]);
  }
  // 連打カウンタ
  const ar = activeRoll(now);
  if(ar){ text(ar.hits,LANE_X,hy-dir*110,54,ROLL); text("HIT",LANE_X,hy-dir*110+22,14,"#ccc"); }
  // ボタン表示(左右1つずつ)
  const ky = CFG.flowDown ? hy+R+70 : hy-R-70;
  const pressed = [0,1].map(i=> Object.keys(held).some(k=> KEY_LANE[k]===i || k==="pointer"+i));
  [["ドン",0],["カッ",1]].forEach(([label,i])=>{
    const on=pressed[i];
    g.beginPath(); g.roundRect(LANE_XS[i]-52,ky-26,104,52,12); g.fillStyle=on?LANE_COL[i]:"#20202c"; g.fill();
    g.lineWidth=3; g.strokeStyle=LANE_COL[i]; g.stroke();
    text(label,LANE_XS[i],ky+9,24,on?"#fff":LANE_COL[i]);
  });
  // HUD
  text(`SCORE ${score}`,16,32,22,"#fff","left");
  text(`${song().title} / ${LEVELS[level].name}`,W-16,32,14,LEVELS[level].color,"right");
  if(combo>=2){ text(combo,SIDE_X[0],H/2+90,48,"rgba(255,255,255,0.85)"); text("COMBO",SIDE_X[0],H/2+112,13,"#ccc"); }
  if(lastJudge && performance.now()-lastJudge.t<500){
    const c={perfect:"#ffd24d",great:"#6dff7a",good:"#4dc3ff",miss:"#ff4d6d"}[lastJudge.kind];
    text(lastJudge.kind.toUpperCase(),LANE_XS[lastJudge.lane],hy+dir*-(R+30),22,c);
  }
  const prog = Math.max(0,Math.min(1,now/songLen));
  g.fillStyle="#223"; g.fillRect(0,H-6,W,6); g.fillStyle="#6af"; g.fillRect(0,H-6,W*prog,6);
  if(state==="play") button("ポーズ (Esc)",W-122,H-40,112,28,pause);
  if(now<0) text(`${Math.ceil(-now)}`,W/2,H/2,64,"rgba(255,255,255,.4)");
  if(state==="pause"){
    g.fillStyle="rgba(0,0,0,0.78)"; g.fillRect(0,0,W,H);
    text("PAUSE",W/2,200,40);
    button("再開 (Esc)",W/2-120,250,240,48,resume,"#3d9bff");
    button("やり直し (R)",W/2-120,312,240,48,()=>{ ac.resume(); start(); });
    button("タイトルへ戻る (T)",W/2-120,374,240,48,toTitle);
    text(settingsLine(),W/2,470,11,"#889");
  }
}
function loop(){ frameN++; update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
<script src="../assets/back-button.js"></script>
