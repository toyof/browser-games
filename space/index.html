<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Space Shooter - Galaxy Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; background: #05060f; color: #cde; font-family: monospace; }
  body { height: 100dvh; padding: 44px 6px 4px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #335; max-width: 100%; max-height: calc(100dvh - 44px - 64px); min-height: 0; object-fit: contain; touch-action: none; }
  p { margin: 4px; font-size: 11px; line-height: 1.4; opacity: .8; text-align: center; }
</style>
<script src="../assets/audio-unlock.js"></script>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<p>←→/AD: 移動 　Space: 発射 　B/Shift: ボム 　P: 一時停止 　M: 音 　Enter: スタート　｜　タッチ: ドラッグで移動(自動連射)・右下でボム</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const keys = {};
let touching = false, tx = W/2, mouseDown = false;

// ---------- Sound (WebAudio, no assets) ----------
let actx = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  shot: () => beep(880, .08, 'square', .03, -500),
  kill: () => beep(200, .15, 'sawtooth', .06, -150),
  hurt: () => beep(120, .4, 'sawtooth', .1, -80),
  item: () => beep(600, .2, 'triangle', .08, 600),
  boss: () => beep(90, .5, 'square', .08, 40),
  bomb: () => { beep(80, .8, 'sawtooth', .14, -50); beep(300, .5, 'square', .06, -250); },
  warn: () => beep(220, .25, 'square', .07, 0),
  combo: n => beep(400 + Math.min(n, 30) * 20, .1, 'triangle', .05, 200),
  clear: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .08), i * 110)); },
};
const BASS = [55, 55, 82, 55, 65, 55, 98, 82];
let musicStep = 0;
function music() {
  const every = boss ? 7 : 10;
  if (frame % every) return;
  const f = BASS[musicStep++ % BASS.length] * (boss ? 2 : 1);
  beep(f, .12, boss ? 'sawtooth' : 'triangle', .035);
  if (musicStep % 4 === 0) beep(f * 4, .05, 'square', .012);
}

// ---------- Stage definitions ----------
const STAGES = [
  {name: 'EARTH ORBIT',    sky: ['#02030a', '#0b2250'], waves: ['grid', 'vee'],           boss: 'satellite'},
  {name: 'ASTEROID BELT',  sky: ['#0a0604', '#2a1a10'], waves: ['grid', 'swarm'],         boss: 'asteroid', rocks: true},
  {name: 'JUPITER',        sky: ['#0a0403', '#40200e'], waves: ['swarm', 'grid'],         boss: 'worm', lightning: true},
  {name: 'ENEMY FLEET',    sky: ['#03040c', '#240a3a'], waves: ['vee', 'grid', 'swarm'],  boss: 'flagship'},
  {name: 'BLACK HOLE',     sky: ['#000000', '#1a0030'], waves: ['swarm', 'vee', 'grid'],  boss: 'final', gravity: true},
];
const ITEMS = {
  S: {color: '#4cf'}, R: {color: '#fd4'}, H: {color: '#6f8'}, L: {color: '#f6c'}, B: {color: '#f84'},
};
const UPGRADES = [
  {id: 'dmg',    name: 'POWER SHOT',   desc: 'ダメージ +1',            max: 3, apply: () => up.dmg++},
  {id: 'rate',   name: 'OVERCLOCK',    desc: '連射速度アップ',         max: 3, apply: () => up.rate++},
  {id: 'twin',   name: 'TWIN CANNON',  desc: '常時 左右に追加弾',      max: 1, apply: () => up.twin = true},
  {id: 'pierce', name: 'PIERCE',       desc: '弾が敵を貫通する',       max: 1, apply: () => up.pierce = true},
  {id: 'magnet', name: 'MAGNET',       desc: 'アイテムを引き寄せる',   max: 1, apply: () => up.magnet = true},
  {id: 'life',   name: 'HULL PLUS',    desc: '最大ライフ +1 & 全回復', max: 2, apply: () => { up.maxLife++; lives = up.maxLife; }},
  {id: 'bomb',   name: 'BOMB RACK',    desc: 'ボム +2',                max: 99, apply: () => bombs = Math.min(bombs + 2, 6)},
  {id: 'shield', name: 'AUTO SHIELD',  desc: '各ステージ開始時シールド', max: 1, apply: () => up.shield = true},
];

// ---------- State ----------
let state = 'title', player, bullets, enemies, ebullets, items, particles, boss, rocks, bolts, floaters, spawnQ, timers, cards;
let stage = 0, score, lives, bombs, wave, dir, shootCd, invuln, power, up, hi = 0, bestStage = 0, frame = 0;
let combo, comboT, shake, flash, banner, warn, clearing, sel = 0, pickups;
try { hi = +localStorage.getItem('spaceShooterHi') || 0; bestStage = +localStorage.getItem('spaceShooterStage') || 0; } catch (e) {}
const stars = Array.from({length: 90}, () => ({x: Math.random()*W, y: Math.random()*H, s: .4 + Math.random()*2.4}));

const curDef = () => STAGES[stage % STAGES.length];
const diff = () => 1 + stage * 0.2;
const mult = () => Math.min(1 + Math.floor(combo / 5), 8);
const rnd = (a, b) => a + Math.random() * (b - a);
const later = (t, fn) => timers.push({t, fn});

function start() {
  state = 'play'; score = 0; lives = 5; bombs = 3; stage = 0; wave = -1;
  bullets = []; particles = []; enemies = []; ebullets = []; items = []; rocks = []; bolts = [];
  floaters = []; spawnQ = []; timers = []; boss = null; clearing = false; pickups = 0;
  combo = 0; comboT = 0; shake = 0; flash = 0; warn = 0;
  player = {x: W/2, y: H-70};
  shootCd = 0; invuln = 90;
  power = {spread: 0, rapid: 0, shield: 0};
  up = {dmg: 1, rate: 0, twin: false, pierce: false, magnet: false, maxLife: 5, shield: false};
  startStage();
}
function startStage() {
  wave = -1; clearing = true; enemies = []; ebullets = []; rocks = []; bolts = []; spawnQ = [];
  banner = 150;
  if (up.shield) power.shield = 900;
  bestStage = Math.max(bestStage, stage + 1);
  try { localStorage.setItem('spaceShooterStage', bestStage); } catch (e) {}
  later(150, () => { clearing = false; });
}

// ---------- Spawning ----------
function mkEnemy(o) {
  const hp = Math.max(1, Math.round((o.hp || 1) * (1 + stage * 0.07)));
  return Object.assign({t: 0, hp, max: hp, hit: 0, ph: Math.random()*6}, o);
}
function spawnWave(kind) {
  const d = diff();
  if (kind === 'grid') {
    const rows = Math.min(3 + Math.floor(stage / 2), 5), cols = 8;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      let type = 'grunt', hp = 1;
      if (r === 0 && stage >= 1) { type = 'shooter'; hp = 2; }
      if (r === 1 && stage >= 3) { type = 'tank'; hp = 4; }
      enemies.push(mkEnemy({kind: 'grid', type, hp, x: 50 + c*50, y: -200 + r*36, ty: 60 + r*36, r}));
    }
    dir = 1;
  } else if (kind === 'vee') {
    const n = 9 + Math.min(stage, 4);
    for (let i = 0; i < n; i++) {
      const k = i - (n-1)/2;
      spawnQ.push({t: i*14, e: mkEnemy({kind: 'zig', type: 'zig', hp: 1, x0: W/2 + k*28, x: W/2, y: -20 - Math.abs(k)*10, vy: 1.3 + d*.1, amp: 70, r: 3})});
    }
    for (let i = 0; i < 4 + stage; i++)
      spawnQ.push({t: 200 + i*18, e: mkEnemy({kind: 'zig', type: 'zig', hp: 2, x0: rnd(80, W-80), x: 0, y: -20, vy: 1.6, amp: 90, r: 4})});
  } else if (kind === 'swarm') {
    const n = 12 + stage * 2;
    for (let i = 0; i < n; i++)
      spawnQ.push({t: i*20, e: mkEnemy({kind: 'dive', type: 'dive', hp: 1, x: rnd(40, W-40), y: -20, ty: rnd(60, 220), mode: 0, r: 2})});
    for (let i = 0; i < 3 + stage; i++)
      spawnQ.push({t: 60 + i*60, e: mkEnemy({kind: 'zig', type: 'shooter', hp: 2, x0: rnd(80, W-80), x: 0, y: -20, vy: 1.1, amp: 50, r: 1})});
  }
}
function spawnBoss() {
  const kind = curDef().boss;
  const hp = Math.round((50 + stage * 18) * (kind === 'final' ? 1.4 : 1));
  boss = {kind, x: W/2, y: 100, hp, max: hp, t: 0, hit: 0, w: 52, h: 30, rage: false};
  if (kind === 'flagship') { boss.w = 90; boss.h = 30; }
  if (kind === 'worm') { boss.w = 40; boss.h = 34; boss.trail = []; }
  if (kind === 'final') { boss.w = 60; boss.h = 44; }
  sfx.boss();
}

// ---------- Helpers ----------
function explode(x, y, color, n = 12, speed = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, v = 1 + Math.random()*speed;
    particles.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 25 + Math.random()*20, color, s: 2 + Math.random()*2});
  }
}
function popup(x, y, text, color = '#fff', big = false) { floaters.push({x, y, text, color, t: 50, big}); }
function efire(x, y, ang, sp, r = 4) { ebullets.push({x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, r}); }
function aimAt(x, y) { return Math.atan2(player.y - y, player.x - x); }
function addScore(n) { score += n * mult(); }
function dropItem(x, y, force) {
  if (!force && Math.random() > 0.07) return;
  const ks = Object.keys(ITEMS);
  items.push({x, y, k: force ? 'B' : ks[Math.floor(Math.random()*ks.length)]});
}
function killEnemy(e) {
  e.dead = true; combo++; comboT = 100;
  addScore(10 * (e.type === 'tank' ? 4 : e.type === 'shooter' ? 2 : 1));
  explode(e.x, e.y, ['#fc6', '#f84', '#fe8'][Math.floor(Math.random()*3)]); sfx.kill(); dropItem(e.x, e.y);
  if (combo > 0 && combo % 5 === 0) { popup(e.x, e.y - 10, 'x' + mult() + ' COMBO!', '#fd4'); sfx.combo(combo); }
}
function hurt() {
  if (invuln > 0) return;
  combo = 0;
  if (power.shield > 0) { power.shield = 0; invuln = 60; sfx.hurt(); explode(player.x, player.y, '#4cf', 16); shake = 8; return; }
  lives--; invuln = 180; ebullets = []; sfx.hurt(); explode(player.x, player.y, '#4f8', 30, 5);
  shake = 18; flash = 10; power.spread = power.rapid = 0;
  if (lives <= 0) gameOver();
}
function useBomb() {
  if (bombs <= 0 || state !== 'play') return;
  bombs--; sfx.bomb(); flash = 25; shake = 22;
  for (const b of ebullets) { addScore(2); particles.push({x: b.x, y: b.y, vx: 0, vy: -2, life: 20, color: '#ff8', s: 3}); }
  ebullets = [];
  for (const e of enemies) { e.hp -= 6; e.hit = 6; if (e.hp <= 0 && !e.dead) killEnemy(e); }
  if (boss) { boss.hp -= Math.round(boss.max * 0.07); boss.hit = 8; }
  rocks.forEach(r => { r.dead = true; explode(r.x, r.y, '#a86', 12); });
  popup(player.x, player.y - 40, 'BOMB!', '#f84', true);
  invuln = Math.max(invuln, 60);
  for (let i = 0; i < 60; i++) explode(player.x, player.y, '#fc8', 1, 12);
}
function gameOver() {
  state = 'over';
  if (score > hi) { hi = score; try { localStorage.setItem('spaceShooterHi', hi); } catch (e) {} }
}
function makeCards() {
  const pool = UPGRADES.filter(u => (up['_' + u.id] || 0) < u.max);
  cards = [];
  while (cards.length < 3 && pool.length) cards.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  sel = 0;
}
function pickCard(i) {
  const u = cards[i]; if (!u) return;
  u.apply(); up['_' + u.id] = (up['_' + u.id] || 0) + 1;
  sfx.item(); stage++; state = 'play'; invuln = 120; bullets = []; items = [];
  startStage();
}

// ---------- Boss behaviour ----------
function bossUpdate(b) {
  b.t++; if (b.hit > 0) b.hit--;
  b.rage = b.hp < b.max * 0.5;
  const t = b.t, r = b.rage ? 1 : 0;
  if (b.kind === 'satellite') {
    b.x = W/2 + Math.sin(t * (.02 + r*.01)) * 160; b.y = 100;
    if (t % (70 - r*14) === 0) for (let i = -2 - r; i <= 2 + r; i++) efire(b.x, b.y+30, Math.PI/2 + i*.17, 3);
    if (t % 120 === 60) for (let i = 0; i < 12 + r*6; i++) efire(b.x, b.y, i/(12+r*6)*Math.PI*2 + t*.01, 2.2);
  } else if (b.kind === 'asteroid') {
    b.x = W/2 + Math.sin(t*.025) * 150; b.y = 90 + Math.sin(t*.05) * 20;
    if (t % (80 - r*30) === 0) rocks.push({x: b.x, y: b.y+30, vx: rnd(-1.5, 1.5), vy: 2.5, rad: 16 + rnd(0, 8), rot: 0, v: rockVerts()});
    if (t % 70 === 0) { const a = aimAt(b.x, b.y); for (let i = -r; i <= r; i++) efire(b.x, b.y+20, a + i*.2, 3.5); }
  } else if (b.kind === 'worm') {
    b.x = W/2 + Math.sin(t*.02) * 160; b.y = 100 + Math.sin(t*.045) * 40;
    b.trail.unshift({x: b.x, y: b.y}); if (b.trail.length > 60) b.trail.pop();
    if (t % (7 - r*2) === 0) { efire(b.x, b.y, t*.17, 2.3); if (r) efire(b.x, b.y, t*.17 + Math.PI, 2.3); }
    if (t % 150 === 100) { const a = aimAt(b.x, b.y); for (let i = -3; i <= 3; i++) efire(b.x, b.y, a + i*.12, 4); }
  } else if (b.kind === 'flagship') {
    b.x = W/2 + Math.sin(t*.015) * 110; b.y = 95;
    if (t % (70 - r*14) === 0) for (const ox of [-60, 60]) efire(b.x+ox, b.y+20, aimAt(b.x+ox, b.y+20), 4);
    if (t % 200 === 100) for (let i = 0; i < 4; i++)
      enemies.push(mkEnemy({kind: 'dive', type: 'dive', hp: 1, x: b.x + (i-1.5)*30, y: b.y + 20, ty: b.y + 60 + i*20, mode: 0, r: 2}));
    if (r && t % 90 === 0) for (let i = 0; i < 14; i++) efire(b.x, b.y, i/14*Math.PI*2, 2.4);
  } else if (b.kind === 'final') {
    const p = b.hp > b.max*.66 ? 0 : b.hp > b.max*.33 ? 1 : 2;
    b.x = W/2 + Math.sin(t*.02) * 130; b.y = 110 + Math.sin(t*.04) * 25;
    if (t % 5 === 0 && p !== 1) { efire(b.x, b.y, t*.12, 2.4); efire(b.x, b.y, t*.12 + Math.PI, 2.4); }
    if (p >= 1 && t % 55 === 0) { const a = aimAt(b.x, b.y); for (let i = -2; i <= 2; i++) efire(b.x, b.y, a + i*.14, 4); }
    if (p === 2 && t % 110 === 50) for (let i = 0; i < 20; i++) efire(b.x, b.y, i/20*Math.PI*2, 2.8);
    if (p === 2 && t % 200 === 150) bolts.push({x: player.x, t: 70});
  }
}
function rockVerts() { return Array.from({length: 9}, (_, i) => 0.7 + Math.random()*0.5); }

// ---------- Update ----------
function update() {
  frame++;
  const def = curDef();
  // parallax stars
  for (const s of stars) { s.y += s.s * (state === 'play' ? 1 + (boss ? .5 : 0) : .6); if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }
  if (state !== 'play') { if (flash > 0) flash--; return; }
  music();

  // timers & banner
  if (banner > 0) banner--;
  if (warn > 0) { warn--; if (warn % 30 === 0) sfx.warn(); }
  for (const tm of timers) tm.t--;
  const due = timers.filter(tm => tm.t <= 0); timers = timers.filter(tm => tm.t > 0);
  due.forEach(tm => tm.fn());
  if (shake > 0) shake *= .9; if (shake < .3) shake = 0;
  if (flash > 0) flash--;

  // player
  const sp = 5.5;
  if (keys.ArrowLeft || keys.KeyA) player.x -= sp;
  if (keys.ArrowRight || keys.KeyD) player.x += sp;
  if (touching) player.x += Math.max(-10, Math.min(10, tx - player.x));
  if (def.gravity && !boss) player.x += (W/2 - player.x) * 0.012;
  else if (def.gravity) player.x += (W/2 - player.x) * 0.006;
  player.x = Math.max(20, Math.min(W-20, player.x));
  if (shootCd > 0) shootCd--;
  if ((keys.Space || touching) && shootCd === 0) {
    const vxs = power.spread > 0 ? [-2.5, 0, 2.5] : [0];
    for (const vx of vxs) bullets.push({x: player.x, y: player.y-16, vx, dmg: up.dmg, pierce: up.pierce});
    if (up.twin) for (const ox of [-12, 12]) bullets.push({x: player.x+ox, y: player.y-8, vx: ox/12*.8, dmg: up.dmg, pierce: up.pierce});
    shootCd = Math.max(4, (power.rapid > 0 ? 7 : 14) - up.rate*2);
    sfx.shot();
  }
  if (invuln > 0) invuln--;
  for (const k in power) if (power[k] > 0) power[k]--;
  if (comboT > 0 && --comboT === 0) combo = 0;
  // engine trail
  if (frame % 2 === 0) particles.push({x: player.x + rnd(-4, 4), y: player.y + 14, vx: rnd(-.3, .3), vy: 2 + Math.random()*2, life: 12, color: '#6cf', s: 2});

  // bullets
  bullets.forEach(b => { b.y -= 10; b.x += b.vx; });
  bullets = bullets.filter(b => b.y > -10 && b.x > -10 && b.x < W+10 && !b.dead);
  ebullets.forEach(b => {
    if (def.gravity) b.vx += (W/2 - b.x) * 0.00025;
    b.y += b.vy; b.x += b.vx;
  });
  ebullets = ebullets.filter(b => b.y < H+10 && b.y > -30 && b.x > -20 && b.x < W+20);

  // spawn queue
  for (const q of spawnQ) q.t--;
  spawnQ.filter(q => q.t <= 0).forEach(q => enemies.push(q.e));
  spawnQ = spawnQ.filter(q => q.t > 0);

  // enemies
  const grid = enemies.filter(e => e.kind === 'grid');
  if (grid.length) {
    const entering = grid.some(e => e.y < e.ty - 1);
    if (entering) grid.forEach(e => { if (e.y < e.ty) e.y += 4; });
    else {
      const speed = (0.5 + stage*.08) * (1 + (40 - grid.length) / 22);
      let edge = false;
      for (const e of grid) { e.x += dir * speed; if (e.x < 20 || e.x > W-20) edge = true; }
      if (edge) { dir *= -1; grid.forEach(e => e.y += 14); }
      if (Math.random() < 0.012 + stage*.002) {
        const e = grid[Math.floor(Math.random()*grid.length)];
        ebullets.push({x: e.x, y: e.y+12, vx: 0, vy: 2.8 + stage*.15, r: 4});
      }
      for (const e of grid) if (e.type === 'shooter' && ++e.t % 180 === 0) efire(e.x, e.y+10, aimAt(e.x, e.y), 2.6);
    }
  }
  for (const e of enemies) {
    if (e.hit > 0) e.hit--;
    if (e.kind === 'zig') {
      e.t++; e.y += e.vy; e.x = e.x0 + Math.sin(e.t*.05 + e.ph) * e.amp;
      if (e.type === 'shooter' && e.t % 130 === 65) efire(e.x, e.y+8, aimAt(e.x, e.y), 2.6);
      else if (e.type === 'zig' && e.t % 110 === 55 && stage >= 1) efire(e.x, e.y+8, Math.PI/2, 3);
      if (e.y > H+20) e.dead = true;
    } else if (e.kind === 'dive') {
      e.t++;
      if (e.mode === 0) { e.y += 3; if (e.y >= e.ty) { e.mode = 1; e.wait = 35; } }
      else if (e.mode === 1) {
        e.x += Math.sin(e.t*.4) * 1.2;
        if (--e.wait <= 0) { const a = aimAt(e.x, e.y), s = 4.5 + diff()*.6; e.vx = Math.cos(a)*s; e.vy = Math.sin(a)*s; e.mode = 2; }
      } else { e.x += e.vx; e.y += e.vy; if (e.y > H+30 || e.x < -30 || e.x > W+30) e.dead = true; }
    }
  }

  // rocks
  if (def.rocks && !boss && frame % Math.max(50, 100 - stage*4) === 0 && (enemies.length || spawnQ.length))
    rocks.push({x: rnd(30, W-30), y: -30, vx: rnd(-.8, .8), vy: rnd(1.4, 2.6), rad: 12 + rnd(0, 14), rot: 0, v: rockVerts()});
  rocks.forEach(r => { r.x += r.vx; r.y += r.vy; r.rot += .02; });
  rocks = rocks.filter(r => r.y < H+40 && !r.dead);

  // lightning
  if (def.lightning && frame % 230 === 0 && (enemies.length || boss)) bolts.push({x: Math.max(30, Math.min(W-30, player.x + rnd(-80, 80))), t: 100});
  for (const bt of bolts) {
    bt.t--;
    if (bt.t === 14) { shake = Math.max(shake, 6); beep(70, .3, 'sawtooth', .08, 60); }
    if (bt.t < 14 && bt.t > 0 && Math.abs(player.x - bt.x) < 22) hurt();
  }
  bolts = bolts.filter(bt => bt.t > 0);

  // boss
  if (boss) {
    bossUpdate(boss);
    for (const b of bullets) {
      if (!b.dead && Math.abs(b.x-boss.x) < boss.w && Math.abs(b.y-boss.y) < boss.h) {
        if (!b.pierce) b.dead = true;
        boss.hp -= b.dmg; boss.hit = 3; addScore(5); explode(b.x, b.y, '#fff', 2);
        if (boss.hp <= 0) {
          explode(boss.x, boss.y, '#f84', 120, 7); sfx.kill(); sfx.bomb();
          addScore(500 + stage*200); dropItem(boss.x, boss.y, true);
          popup(boss.x, boss.y, 'BOSS DOWN!', '#fd4', true);
          flash = 30; shake = 25; ebullets = []; rocks = []; bolts = [];
          boss = null; clearing = true;
          later(100, () => { sfx.clear(); popup(W/2, 250, 'STAGE CLEAR', '#6f8', true); });
          later(220, () => { state = 'upgrade'; makeCards(); });
          break;
        }
      }
    }
  }

  // player bullets vs rocks / enemies
  for (const b of bullets) {
    for (const r of rocks) if (!b.dead && Math.hypot(b.x-r.x, b.y-r.y) < r.rad) { b.dead = true; explode(b.x, b.y, '#a86', 3); }
    for (const e of enemies) {
      if (b.dead && !b.pierce) break;
      if (!e.dead && !(b.hits && b.hits.includes(e)) && Math.abs(b.x-e.x) < 16 && Math.abs(b.y-e.y) < 12) {
        if (b.pierce) (b.hits = b.hits || []).push(e); else b.dead = true;
        e.hp -= b.dmg; e.hit = 3;
        if (e.hp <= 0) killEnemy(e); else explode(b.x, b.y, '#fff', 2);
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  // items
  for (const it of items) {
    if (up.magnet) { const dx = player.x-it.x, dy = player.y-it.y, d = Math.hypot(dx, dy); if (d < 160) { it.x += dx/d*4; it.y += dy/d*4; } }
    it.y += 2;
    if (Math.abs(it.x-player.x) < 22 && Math.abs(it.y-player.y) < 22) {
      it.got = true; sfx.item(); addScore(50);
      if (it.k === 'S') power.spread = 700;
      if (it.k === 'R') power.rapid = 700;
      if (it.k === 'H') power.shield = 900;
      if (it.k === 'L') lives = Math.min(lives + 1, up.maxLife + 2);
      if (it.k === 'B') bombs = Math.min(bombs + 1, 6);
      popup(it.x, it.y - 10, {S: 'SPREAD', R: 'RAPID', H: 'SHIELD', L: '1UP', B: '+BOMB'}[it.k], ITEMS[it.k].color);
    }
  }
  items = items.filter(it => !it.got && it.y < H+10);

  // damage to player
  const hit = ebullets.some(b => Math.abs(b.x-player.x) < 10 + b.r*.4 && Math.abs(b.y-player.y) < 12 + b.r*.4)
           || enemies.some(e => Math.abs(e.x-player.x) < 20 && Math.abs(e.y-player.y) < 18)
           || rocks.some(r => Math.hypot(r.x-player.x, r.y-player.y) < r.rad + 8)
           || (boss && Math.abs(boss.x-player.x) < boss.w && Math.abs(boss.y-player.y) < boss.h + 4);
  if (hit) hurt();
  if (state === 'play' && enemies.some(e => e.kind === 'grid' && e.y > H-100)) gameOver();

  // particles & floaters
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  floaters.forEach(f => { f.y -= .8; f.t--; });
  floaters = floaters.filter(f => f.t > 0);

  // progression
  if (state === 'play' && !clearing && !boss && !enemies.length && !spawnQ.length) {
    clearing = true; wave++;
    if (wave < curDef().waves.length) {
      if (wave > 0) { addScore(100); popup(W/2, 220, 'WAVE CLEAR +100', '#6f8'); }
      later(wave > 0 ? 80 : 10, () => { spawnWave(curDef().waves[wave]); clearing = false; });
    } else {
      addScore(200); popup(W/2, 220, 'WAVE CLEAR +200', '#6f8');
      later(60, () => { warn = 150; });
      later(210, () => { spawnBoss(); clearing = false; });
    }
  }
}

// ---------- Draw ----------
function drawBackground() {
  const def = curDef();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, def.sky[0]); g.addColorStop(1, def.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s = stage % STAGES.length;
  if (s === 0) { // Earth
    const eg = ctx.createRadialGradient(W/2, H+380, 330, W/2, H+380, 420);
    eg.addColorStop(0, '#1a5fb4'); eg.addColorStop(.9, '#2a8fe0'); eg.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(W/2, H+380, 420, 0, 7); ctx.fill();
  } else if (s === 2) { // Jupiter
    ctx.save(); ctx.beginPath(); ctx.arc(W+40, 200, 200, 0, 7); ctx.clip();
    const cols = ['#c98a5a', '#e8c9a0', '#a8643a', '#f0d8b0', '#b0724a'];
    for (let i = 0; i < 12; i++) { ctx.fillStyle = cols[i % 5]; ctx.fillRect(W-200, 0 + i*34 + (frame*.05 % 34), 400, 22); }
    ctx.restore();
  } else if (s === 3) { // nebula
    for (let i = 0; i < 3; i++) {
      const ng = ctx.createRadialGradient(100 + i*140, 200 + i*120, 10, 100 + i*140, 200 + i*120, 200);
      ng.addColorStop(0, ['rgba(180,60,200,.25)', 'rgba(60,120,220,.2)', 'rgba(220,80,120,.2)'][i]); ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H);
    }
  } else if (s === 4) { // black hole
    const cx = W/2, cy = 300;
    for (let i = 0; i < 6; i++) {
      ctx.strokeStyle = `rgba(${180 - i*20},${80 + i*10},255,${.5 - i*.07})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, cy, 150 - i*18, 40 - i*4, frame*.01 + i*.4, 0, 7); ctx.stroke();
    }
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 32, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#fff';
  for (const st of stars) { ctx.globalAlpha = .4 + st.s/4; ctx.fillRect(st.x, st.y, st.s, st.s * (state === 'play' ? 1 + st.s : 1)); }
  ctx.globalAlpha = 1;
}
function drawShip(x, y) {
  ctx.fillStyle = '#4f8';
  ctx.beginPath(); ctx.moveTo(x, y-18); ctx.lineTo(x+7, y-2); ctx.lineTo(x+18, y+12); ctx.lineTo(x+6, y+8); ctx.lineTo(x, y+14);
  ctx.lineTo(x-6, y+8); ctx.lineTo(x-18, y+12); ctx.lineTo(x-7, y-2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#bff'; ctx.beginPath(); ctx.ellipse(x, y-2, 3, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fa4'; ctx.fillRect(x-3, y+12, 6, 4 + Math.random()*6);
}
const ECOL = {grunt: '#f6c', zig: '#4cf', dive: '#fd4', shooter: '#f84', tank: '#a8f'};
function drawEnemy(e) {
  const c = e.hit > 0 ? '#fff' : ECOL[e.type] || '#f6c';
  ctx.fillStyle = c;
  if (e.type === 'dive') {
    ctx.beginPath(); ctx.moveTo(e.x, e.y+12); ctx.lineTo(e.x+13, e.y-10); ctx.lineTo(e.x, e.y-4); ctx.lineTo(e.x-13, e.y-10); ctx.closePath(); ctx.fill();
  } else if (e.type === 'zig') {
    ctx.beginPath(); ctx.arc(e.x, e.y, 12, 0, 7); ctx.fill(); ctx.fillRect(e.x-18, e.y-2, 36, 4);
    ctx.fillStyle = '#000'; ctx.fillRect(e.x-5, e.y-3, 3, 4); ctx.fillRect(e.x+2, e.y-3, 3, 4);
  } else {
    const w = e.type === 'tank' ? 17 : 14;
    ctx.fillRect(e.x-w, e.y-8, w*2, 16); ctx.fillRect(e.x-8, e.y-12, 16, 4);
    if (e.type === 'tank') { ctx.fillRect(e.x-w-3, e.y-4, 3, 12); ctx.fillRect(e.x+w, e.y-4, 3, 12); }
    ctx.fillStyle = '#000'; ctx.fillRect(e.x-8, e.y-3, 4, 4); ctx.fillRect(e.x+4, e.y-3, 4, 4);
  }
  if (e.max > 1 && e.hp < e.max) { ctx.fillStyle = '#400'; ctx.fillRect(e.x-12, e.y-17, 24, 3); ctx.fillStyle = '#f55'; ctx.fillRect(e.x-12, e.y-17, 24*e.hp/e.max, 3); }
}
function drawBoss(b) {
  const x = b.x, y = b.y, hit = b.hit > 0, pulse = Math.sin(b.t*.1)*.5 + .5;
  const base = c => hit ? '#fff' : c;
  if (b.kind === 'satellite') {
    ctx.fillStyle = base('#789'); ctx.fillRect(x-50, y-10, 100, 20);
    ctx.fillStyle = base('#38c'); ctx.fillRect(x-120, y-18, 66, 36); ctx.fillRect(x+54, y-18, 66, 36);
    ctx.fillStyle = base('#cdd'); ctx.fillRect(x-24, y-28, 48, 56);
    ctx.fillStyle = b.rage ? '#f33' : '#ff0'; ctx.fillRect(x-14, y-8, 28, 14);
  } else if (b.kind === 'asteroid') {
    ctx.fillStyle = base('#7a5a42'); ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i/10*Math.PI*2, r = 46 + (i%3)*8; ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r*.7); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = base('#a07a5a'); ctx.beginPath(); ctx.arc(x-14, y-8, 10, 0, 7); ctx.arc(x+16, y+8, 8, 0, 7); ctx.fill();
    ctx.fillStyle = b.rage ? '#f33' : '#fa0'; ctx.fillRect(x-6, y-4, 12, 8);
  } else if (b.kind === 'worm') {
    for (let i = b.trail.length-1; i >= 4; i -= 4) {
      const p = b.trail[i], r = 10 + (60-i)*.25;
      ctx.fillStyle = hit ? '#fff' : `hsl(${20 + i}, 70%, ${35 + i*.3}%)`; ctx.beginPath(); ctx.arc(p.x, p.y - 10 + i*.3, r, 0, 7); ctx.fill();
    }
    ctx.fillStyle = base('#e85'); ctx.beginPath(); ctx.arc(x, y, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x-12, y-6, 7, 0, 7); ctx.arc(x+12, y-6, 7, 0, 7); ctx.fill();
    ctx.fillStyle = b.rage ? '#f00' : '#000'; ctx.beginPath(); ctx.arc(x-12, y-6, 3, 0, 7); ctx.arc(x+12, y-6, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#600'; ctx.fillRect(x-16, y+10, 32, 8);
  } else if (b.kind === 'flagship') {
    ctx.fillStyle = base('#556'); ctx.beginPath(); ctx.moveTo(x-100, y-10); ctx.lineTo(x+100, y-10); ctx.lineTo(x+60, y+30); ctx.lineTo(x-60, y+30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = base('#889'); ctx.fillRect(x-30, y-30, 60, 24);
    ctx.fillStyle = b.rage ? '#f33' : '#f84'; ctx.fillRect(x-66, y+18, 12, 12); ctx.fillRect(x+54, y+18, 12, 12);
    ctx.fillStyle = '#6ff'; ctx.fillRect(x-14, y-24, 28, 8);
  } else {
    ctx.strokeStyle = `rgba(200,100,255,${.4 + pulse*.5})`; ctx.lineWidth = 4;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x, y, 38 + i*10 + pulse*4, b.t*.03 + i, b.t*.03 + i + 4); ctx.stroke(); }
    ctx.fillStyle = base('#406'); ctx.beginPath(); ctx.arc(x, y, 36, 0, 7); ctx.fill();
    ctx.fillStyle = base(`rgb(255,${100 + pulse*100|0},255)`); ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#a4f'; ctx.fillRect(x-60, y-6, 20, 12); ctx.fillRect(x+40, y-6, 20, 12);
  }
  ctx.fillStyle = '#400'; ctx.fillRect(W/2-120, 34, 240, 8);
  ctx.fillStyle = b.rage ? '#f84' : '#f33'; ctx.fillRect(W/2-120, 34, 240 * Math.max(b.hp, 0) / b.max, 8);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(W/2-120, 34, 240, 8);
}
function drawRock(r) {
  ctx.fillStyle = '#6b5444'; ctx.strokeStyle = '#a08060'; ctx.lineWidth = 2; ctx.beginPath();
  r.v.forEach((m, i) => { const a = i/r.v.length*Math.PI*2 + r.rot; ctx.lineTo(r.x + Math.cos(a)*r.rad*m, r.y + Math.sin(a)*r.rad*m); });
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function bomb_icon(x, y) { ctx.fillStyle = '#f84'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#fd4'; ctx.fillRect(x-1, y-9, 2, 4); }

function drawTitleBits(cy) {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6cf'; ctx.font = 'bold 40px monospace'; ctx.fillText('GALAXY RUN', W/2, cy);
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText('SPACE SHOOTER', W/2, cy + 24);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBackground();
  ctx.textAlign = 'center';

  if (state === 'title') {
    drawTitleBits(230);
    ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
    if (Math.floor(frame/30) % 2) ctx.fillText('Press ENTER / TAP to start', W/2, 320);
    ctx.fillStyle = '#fd4'; ctx.fillText('HI-SCORE ' + hi, W/2, 360);
    ctx.fillStyle = '#8ac'; ctx.font = '13px monospace';
    ctx.fillText('地球軌道 → 小惑星帯 → 木星 → 敵艦隊 → ブラックホール', W/2, 410);
    ctx.fillText('撃破でコンボ倍率UP / ボスを倒して強化を選べ!', W/2, 432);
    if (bestStage) ctx.fillText('到達ステージ最高: ' + bestStage, W/2, 460);
    ctx.restore(); return;
  }

  // world
  for (const bt of bolts) {
    if (bt.t >= 14) { ctx.fillStyle = `rgba(255,255,100,${.1 + (bt.t % 8 < 4 ? .15 : 0)})`; ctx.fillRect(bt.x-22, 0, 44, H); }
    else { ctx.fillStyle = '#ffd'; ctx.fillRect(bt.x-14, 0, 28, H); ctx.fillStyle = '#6cf'; ctx.fillRect(bt.x-5, 0, 10, H); }
  }
  rocks.forEach(drawRock);
  items.forEach(it => {
    const d = ITEMS[it.k];
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(it.x, it.y, 11 + Math.sin(frame*.2)*1.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold 13px monospace'; ctx.fillText(it.k, it.x, it.y+4);
  });
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) { ctx.globalAlpha = Math.max(p.life / 40, 0); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  enemies.forEach(drawEnemy);
  if (boss) drawBoss(boss);
  if (!(invuln > 0 && Math.floor(invuln/5) % 2) && state !== 'over') drawShip(player.x, player.y);
  if (power.shield > 0) {
    ctx.strokeStyle = power.shield < 120 && Math.floor(power.shield/6) % 2 ? '#fff' : '#4cf'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = up && up.pierce ? '#8ff' : '#ff6';
  bullets.forEach(b => ctx.fillRect(b.x-2, b.y-8, 4, 14));
  ctx.fillStyle = '#f55';
  ebullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.fillStyle = '#fcc'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*.45, 0, 7); ctx.fill(); ctx.fillStyle = '#f55'; });
  floaters.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.t/20); ctx.fillStyle = f.color; ctx.font = (f.big ? 'bold 26px' : 'bold 13px') + ' monospace'; ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 10, 20);
  ctx.fillStyle = '#fd4'; ctx.fillText('HI ' + Math.max(hi, score), 10, 38);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText('STAGE ' + (stage+1) + (boss ? '  BOSS' : '  W' + Math.max(wave+1, 1) + '/' + curDef().waves.length), W/2, 20);
  ctx.textAlign = 'right'; ctx.fillText(lives > 6 ? '♥ x' + lives : '♥'.repeat(Math.max(lives, 0)), W-10, 20);
  if (muted) ctx.fillText('MUTE', W-10, 56);
  for (let i = 0; i < bombs; i++) bomb_icon(W-18-i*16, 36);
  if (combo >= 2) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#fd4'; ctx.font = 'bold 16px monospace';
    ctx.fillText(combo + ' HIT  x' + mult(), 10, 60);
    ctx.fillStyle = '#430'; ctx.fillRect(10, 66, 90, 4); ctx.fillStyle = '#fd4'; ctx.fillRect(10, 66, 90*comboT/100, 4);
  }
  ctx.textAlign = 'left'; ctx.font = '12px monospace';
  let y = H - 10;
  for (const [k, label, c] of [['spread', 'SPREAD', '#4cf'], ['rapid', 'RAPID', '#fd4'], ['shield', 'SHIELD', '#6f8']]) {
    if (power[k] > 0) { ctx.fillStyle = c; ctx.fillText(label + ' ' + Math.ceil(power[k]/60) + 's', 10, y); y -= 14; }
  }
  if (state === 'play' && 'ontouchstart' in window) { // bomb button
    ctx.strokeStyle = '#f84'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W-45, H-45, 30, 0, 7); ctx.stroke();
    ctx.fillStyle = '#f84'; ctx.textAlign = 'center'; ctx.font = 'bold 13px monospace'; ctx.fillText('BOMB', W-45, H-41);
  }

  // banners
  ctx.textAlign = 'center';
  if (banner > 0 && state === 'play') {
    const a = Math.min(1, banner/30, (150-banner)/20);
    ctx.globalAlpha = a; ctx.fillStyle = '#6cf'; ctx.font = 'bold 38px monospace'; ctx.fillText('STAGE ' + (stage+1), W/2, 280);
    ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.fillText(curDef().name + (stage >= 5 ? ' (LOOP ' + (Math.floor(stage/5)+1) + ')' : ''), W/2, 315);
    ctx.globalAlpha = 1;
  }
  if (warn > 0) {
    const on = Math.floor(warn/15) % 2;
    ctx.fillStyle = `rgba(255,0,0,${on ? .25 : .08})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f33'; ctx.font = 'bold 44px monospace'; if (on) ctx.fillText('WARNING', W/2, 300);
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace'; ctx.fillText('強大な敵が接近中', W/2, 330);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(flash/25, .8)})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'upgrade') {
    ctx.fillStyle = 'rgba(0,0,10,.82)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#6f8'; ctx.font = 'bold 28px monospace'; ctx.fillText('STAGE ' + (stage+1) + ' CLEAR!', W/2, 110);
    ctx.fillStyle = '#fff'; ctx.font = '15px monospace'; ctx.fillText('強化を1つ選択 (1-3 / ←→+Enter / タップ)', W/2, 145);
    cards.forEach((u, i) => {
      const x = 15 + i*155, y = 190, w = 140, h = 230;
      ctx.fillStyle = i === sel ? '#1a3a5a' : '#0f1a2a'; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = i === sel ? '#fd4' : '#46a'; ctx.lineWidth = i === sel ? 3 : 1; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#fd4'; ctx.font = 'bold 26px monospace'; ctx.fillText(String(i+1), x+w/2, y+40);
      ctx.fillStyle = '#6cf'; ctx.font = 'bold 14px monospace'; ctx.fillText(u.name, x+w/2, y+90);
      ctx.fillStyle = '#cde'; ctx.font = '12px monospace';

    ctx.fillStyle = '#8ac'; ctx.font = '13px monospace'; ctx.fillText('SCORE ' + score + '   BOMB ' + bombs + '   LIFE ' + lives + '/' + up.maxLife, W/2, 480);
  }
  if (state === 'pause') {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '32px monospace'; ctx.fillText('PAUSED', W/2, 300);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f66'; ctx.font = 'bold 38px monospace'; ctx.fillText('GAME OVER', W/2, 260);
    ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
    ctx.fillText('Score: ' + score + '   Stage: ' + (stage+1), W/2, 305);
    ctx.fillStyle = '#fd4'; ctx.fillText((score >= hi ? 'NEW ' : '') + 'HI-SCORE: ' + hi, W/2, 332);
    ctx.fillStyle = '#fff'; ctx.fillText('Press ENTER / TAP to restart', W/2, 380);
  }
}

// ---------- Input ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') {
    if (state === 'title' || state === 'over') start();
    else if (state === 'upgrade') pickCard(sel);
  }
  if (state === 'upgrade') {
    if (e.code === 'ArrowLeft') sel = (sel + 2) % cards.length;
    if (e.code === 'ArrowRight') sel = (sel + 1) % cards.length;
    if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) pickCard(+e.code.slice(-1) - 1);
  }
  if (e.code === 'KeyP') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyB' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowUp') useBomb();
});
addEventListener('keyup', e => keys[e.code] = false);
function toCanvas(e) { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height}; }
cv.addEventListener('pointerdown', e => {
  const p = toCanvas(e);
  if (state === 'title' || state === 'over') { start(); return; }
  if (state === 'upgrade') { for (let i = 0; i < cards.length; i++) if (p.x > 15 + i*155 && p.x < 155 + i*155 && p.y > 190 && p.y < 420) pickCard(i); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (e.pointerType === 'touch' && Math.hypot(p.x - (W-45), p.y - (H-45)) < 40) { useBomb(); return; }
  touching = true; tx = p.x; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (touching) tx = toCanvas(e).x; });
addEventListener('pointerup', () => { touching = false; });
addEventListener('blur', () => { if (state === 'play') state = 'pause'; });

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
