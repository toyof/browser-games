<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Jelly Chain - 連鎖パズル</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; background: #05060f; color: #cde; font-family: monospace; }
  body { height: 100dvh; padding: 44px 6px 4px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #335; aspect-ratio: 400 / 700; height: auto;
           width: min(100%, calc((100dvh - 44px - 30px) * 0.5714)); touch-action: none; }
  p { margin: 4px; font-size: 11px; line-height: 1.4; opacity: .8; text-align: center; }
  @media (max-width: 700px) { p.pc { display: none; } }
</style>
<script src="../assets/audio-unlock.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<p class="pc">← → : 移動 　↓ : 早く落とす 　X / ↑ / Space : 右回転 　Z : 左回転 　Enter: スタート</p>
<script>
// Jelly Chain: 同色4個以上でつなげて消す落ち物パズル(6列×12段)。仕様は REQUIREMENTS.md
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 400, H = 700, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const KEY_BEST = 'jellyBest';
let best = parseInt(lsGet(KEY_BEST), 10) || 0;

// ---- 音 ----
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
}
function tone(f, d, type, v, slide) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
}

// ---- 乱数 ----
let seed = 1;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ---- 定数 ----
const COLS = 6, ROWS = 12, CS = 46, BX = 10, BY = 64;          // 行0は画面外の「隠し段」、行1〜12が見える段
const COLORS = ['#ff4a5a', '#4acf6a', '#4a8aff', '#ffd23a', '#c050e0'], NCOL = 4;
const OFF = [[0, -1], [1, 0], [0, 1], [-1, 0]];                // 子の位置(軸から見て 上/右/下/左)
const CHAIN_B = [0, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448, 480, 512];
const GROUP_B = [0, 0, 0, 0, 0, 2, 3, 4, 5, 6, 7, 10], COLOR_B = [0, 0, 3, 6, 12, 24];

// ---- 状態 ----
let state = 'title', phase = 'fall';                           // phase: fall(操作中) / drop(落下) / pop(消える)
let grid, offs, popping, cur, queue, fallT, lockT, popT, chain, maxChain, score, popped, chainText, chainTextT, shake;
const hold = { left: { on: false, t: 0, n: 0 }, right: { on: false, t: 0, n: 0 }, down: { on: false } };

function emptyGrid() { return Array.from({ length: ROWS + 1 }, () => Array(COLS).fill(-1)); }
function zeroOffs() { return Array.from({ length: ROWS + 1 }, () => Array(COLS).fill(0)); }
function pair() { return [(rnd() * NCOL) | 0, (rnd() * NCOL) | 0]; }
function interval() { return Math.max(0.12, 0.7 - 0.03 * Math.floor(popped / 30)); }
function free(c, r) { return c >= 0 && c < COLS && r >= 0 && r <= ROWS && grid[r][c] < 0; }
function fits(ax, ay, o) { const d = OFF[o]; return free(ax, ay) && free(ax + d[0], ay + d[1]); }

function start() {
  seed = (Math.random() * 1e9) | 0; begin();
}
function begin() {
  grid = emptyGrid(); offs = zeroOffs(); popping = null; queue = [pair(), pair(), pair()];
  score = 0; popped = 0; chain = 0; maxChain = 0; chainText = ''; chainTextT = 0; shake = 0;
  state = 'play'; spawn();
}
function spawn() {
  const q = queue.shift(); queue.push(pair());
  cur = { ax: 2, ay: 1, o: 0, a: q[0], b: q[1] }; fallT = 0; lockT = 0; phase = 'fall';
  if (!fits(cur.ax, cur.ay, cur.o)) gameOver();
}
function gameOver() {
  state = 'over'; tone(220, .6, 'sawtooth', .06, -170);
  if (score > best) { best = score; lsSet(KEY_BEST, String(best)); }
}

// ---- 操作 ----
function move(dx) { if (phase === 'fall' && state === 'play' && fits(cur.ax + dx, cur.ay, cur.o)) { cur.ax += dx; lockT = 0; } }
function rotate(dir) {
  if (phase !== 'fall' || state !== 'play') return;
  const no = (cur.o + dir + 4) % 4, d = OFF[no];
  if (fits(cur.ax, cur.ay, no)) cur.o = no;
  else if (fits(cur.ax - d[0], cur.ay - d[1], no)) { cur.ax -= d[0]; cur.ay -= d[1]; cur.o = no; }   // 壁・床に当たったら押し戻す
  else if (fits(cur.ax, cur.ay, (cur.o + 2) % 4)) cur.o = (cur.o + 2) % 4;                          // 両側が塞がっていたらクイックターン
  else return;
  lockT = 0; tone(600, .04, 'square', .025);
}
function lock() {
  const d = OFF[cur.o];
  grid[cur.ay][cur.ax] = cur.a; grid[cur.ay + d[1]][cur.ax + d[0]] = cur.b;
  tone(160, .06, 'triangle', .06);
  startDrop();
}
function startDrop() {                                          // 重力: 各列を下へ詰め、落ちる距離を offs に入れてアニメする
  let any = false;
  for (let c = 0; c < COLS; c++) {
    let w = ROWS;
    for (let r = ROWS; r >= 0; r--) if (grid[r][c] >= 0) {
      const v = grid[r][c]; grid[r][c] = -1; grid[w][c] = v; offs[w][c] = w - r; if (w !== r) any = true; w--;
    }
  }
  phase = 'drop'; if (!any) phase = 'drop';
}
function findGroups() {
  const seen = Array.from({ length: ROWS + 1 }, () => Array(COLS).fill(false)), groups = [];
  for (let r = 1; r <= ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r][c] < 0 || seen[r][c]) continue;
    const col = grid[r][c], st = [[c, r]], g = []; seen[r][c] = true;
    while (st.length) {
      const [x, y] = st.pop(); g.push([x, y]);
      for (const [dx, dy] of OFF) { const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < COLS && ny >= 1 && ny <= ROWS && !seen[ny][nx] && grid[ny][nx] === col) { seen[ny][nx] = true; st.push([nx, ny]); } }
    }
    if (g.length >= 4) groups.push({ col, cells: g });
  }
  return groups;
}
function checkPop() {
  const groups = findGroups();
  if (!groups.length) {                                         // 連鎖終了 → 次のペア
    if (chain > 0) tone(900, .1, 'sine', .05);
    chain = 0; spawn(); return;
  }
  chain++; if (chain > maxChain) maxChain = chain;
  let n = 0, gb = 0; const cols = new Set();
  for (const g of groups) { n += g.cells.length; gb += GROUP_B[Math.min(g.cells.length, 11)]; cols.add(g.col); }
  const mult = Math.max(1, Math.min(999, CHAIN_B[Math.min(chain, CHAIN_B.length - 1)] + COLOR_B[cols.size] + gb));
  score += 10 * n * mult; popped += n;
  popping = new Set(); for (const g of groups) for (const [x, y] of g.cells) popping.add(y * COLS + x);
  popT = 0; phase = 'pop'; shake = Math.min(1, 0.3 + chain * 0.15);
  if (chain >= 2) { chainText = chain + '連鎖!'; chainTextT = 1.1; }
  tone(440 + chain * 80, .25, 'triangle', .08, 300);
}

function update(dt) {
  if (state !== 'play') return;
  dt = Math.min(dt, 0.05);
  if (chainTextT > 0) chainTextT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3);
  if (phase === 'fall') {
    for (const k of ['left', 'right']) {                        // 長押しリピート
      const h = hold[k]; if (!h.on) continue;
      h.t += dt; while (h.t >= h.n) { move(k === 'left' ? -1 : 1); h.n += 0.05; }
    }
    if (!fits(cur.ax, cur.ay + 1, cur.o)) {
      lockT += dt; if (lockT >= (hold.down.on ? 0.06 : 0.4)) lock();
    } else {
      fallT += dt; const iv = hold.down.on ? 0.04 : interval();
      while (fallT >= iv && fits(cur.ax, cur.ay + 1, cur.o)) { cur.ay++; fallT -= iv; if (hold.down.on) score += 1; }
      if (!fits(cur.ax, cur.ay + 1, cur.o)) fallT = 0;
    }
  } else if (phase === 'drop') {
    let moving = false;
    for (let r = 0; r <= ROWS; r++) for (let c = 0; c < COLS; c++) if (offs[r][c] > 0) { offs[r][c] = Math.max(0, offs[r][c] - dt * 22); if (offs[r][c] > 0) moving = true; }
    if (!moving) checkPop();
  } else if (phase === 'pop') {
    popT += dt;
    if (popT >= 0.4) {
      for (const k of popping) grid[(k / COLS) | 0][k % COLS] = -1;
      popping = null; startDrop();
    }
  }
}

// ---- 描画 ----
const btns = [];
function btn(x, y, w, h, label, fn) {
  ctx.fillStyle = '#ffd060'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();
  ctx.fillStyle = '#210'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1); btns.push({ x, y, w, h, fn });
}
function blob(x, y, s, color, sc, joinR, joinD, join) {         // 中心(x,y)、1マスの大きさ s
  const r = s * 0.44 * (sc == null ? 1 : sc), col = COLORS[color];
  ctx.fillStyle = col;
  if (joinR) ctx.fillRect(x, y - r * 0.8, s, r * 1.6);          // 同色の隣とつなぐ
  if (joinD) ctx.fillRect(x - r * 0.8, y, r * 1.6, s);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .35, r * .3, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; for (const ex of [-1, 1]) { ctx.beginPath(); ctx.arc(x + ex * r * .38, y + r * .05, r * .26, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#111'; for (const ex of [-1, 1]) { ctx.beginPath(); ctx.arc(x + ex * r * .38, y + r * .1, r * .12, 0, 7); ctx.fill(); }
}
function cx(c) { return BX + c * CS + CS / 2; }
function cy(r) { return BY + (r - 1) * CS + CS / 2; }
const CTRL = [{ k: 'left', x: 8, label: '◀' }, { k: 'right', x: 104, label: '▶' }, { k: 'down', x: 200, label: '▼' }, { k: 'rot', x: 296, label: '⟳' }];
function draw() {
  btns.length = 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#070a1c'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 6 * shake, (Math.random() - .5) * 6 * shake);
  ctx.fillStyle = '#0c1030'; ctx.fillRect(BX, BY, COLS * CS, ROWS * CS);
  ctx.strokeStyle = '#335'; ctx.lineWidth = 2; ctx.strokeRect(BX, BY, COLS * CS, ROWS * CS);
  ctx.fillStyle = 'rgba(255,80,80,.5)'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center'; ctx.fillText('✕', cx(2), cy(1) + 6);   // ここが埋まると終了
  if (grid) {
    ctx.save(); ctx.beginPath(); ctx.rect(BX, BY, COLS * CS, ROWS * CS); ctx.clip();
    for (let r = 0; r <= ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = grid[r][c]; if (v < 0) continue;
      const key = r * COLS + c, pop = popping && popping.has(key), o = offs[r][c];
      if (pop) { const t = popT / 0.4; const sc = 1 + 0.15 * Math.sin(t * 20) - t * 0.9; blob(cx(c), cy(r), CS, v, Math.max(0.05, sc)); continue; }
      const jr = o === 0 && c + 1 < COLS && grid[r][c + 1] === v && offs[r][c + 1] === 0 && !(popping && popping.has(key + 1));
      const jd = o === 0 && r + 1 <= ROWS && grid[r + 1][c] === v && offs[r + 1][c] === 0 && !(popping && popping.has(key + COLS));
      blob(cx(c), cy(r - o), CS, v, 1, jr, jd);
    }
    if (state === 'play' && phase === 'fall') {
      const d = OFF[cur.o];
      blob(cx(cur.ax), cy(cur.ay), CS, cur.a); blob(cx(cur.ax + d[0]), cy(cur.ay + d[1]), CS, cur.b);
    }
    ctx.restore();
  }
  ctx.restore();
  // 右パネル
  ctx.fillStyle = '#9ab'; ctx.font = '12px monospace'; ctx.textAlign = 'left'; ctx.fillText('NEXT', 304, 82);
  if (queue) queue.slice(0, 2).forEach((q, i) => { const y = 112 + i * 80; ctx.fillStyle = '#0c1030'; ctx.beginPath(); ctx.roundRect(300, y - 30, 88, 74, 10); ctx.fill(); blob(344, y - 6, 34, q[1]); blob(344, y + 26, 34, q[0]); });
  ctx.fillStyle = '#9ab'; ctx.fillText('SCORE', 304, 290); ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.fillText(score | 0, 304, 314);
  ctx.fillStyle = '#9ab'; ctx.font = '12px monospace'; ctx.fillText('BEST', 304, 346); ctx.fillStyle = '#ffd060'; ctx.font = 'bold 16px monospace'; ctx.fillText(Math.max(best, score | 0), 304, 366);
  ctx.fillStyle = '#9ab'; ctx.font = '12px monospace'; ctx.fillText('LEVEL', 304, 398); ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.fillText(1 + Math.floor(popped / 30), 304, 418);
  ctx.fillStyle = '#9ab'; ctx.font = '12px monospace'; ctx.fillText('MAX 連鎖', 304, 450); ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace'; ctx.fillText(maxChain || 0, 304, 470);
  if (chainTextT > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffd060'; ctx.shadowBlur = 16; ctx.font = 'bold ' + (36 + chainTextT * 10) + 'px monospace';
    ctx.fillText(chainText, BX + COLS * CS / 2, 300); ctx.shadowBlur = 0;
  }
  // 操作ボタン(主操作の回転は右端)
  CTRL.forEach(b => {
    const on = b.k === 'rot' ? false : hold[b.k].on;
    ctx.fillStyle = b.k === 'rot' ? '#ffd060' : (on ? '#4a6ab0' : '#223060'); ctx.beginPath(); ctx.roundRect(b.x, 626, 96 - 4, 66, 14); ctx.fill();
    ctx.fillStyle = b.k === 'rot' ? '#210' : '#cde'; ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.label, b.x + 46, 660); ctx.textBaseline = 'alphabetic';
  });
  if (state === 'title' || state === 'over') {
    ctx.fillStyle = 'rgba(0,0,10,.75)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    if (state === 'title') {
      ctx.shadowColor = '#ff6fc0'; ctx.shadowBlur = 14; ctx.font = 'bold 40px monospace'; ctx.fillText('JELLY CHAIN', W / 2, 190); ctx.shadowBlur = 0;
      ctx.font = '14px monospace'; ctx.fillStyle = '#9ab';
      ctx.fillText('落ちてくるゼリーを', W / 2, 250); ctx.fillText('同じ色で4つ以上つなげて消そう', W / 2, 274);
      ctx.fillText('消えた上のゼリーが落ちて', W / 2, 310); ctx.fillText('次々に消えると「連鎖」!', W / 2, 334);
      ctx.fillText('✕ の位置が埋まるとゲームオーバー', W / 2, 378);
      if (best) ctx.fillText('BEST ' + best, W / 2, 418);
      [0, 1, 2, 3].forEach(i => blob(110 + i * 60, 480, 50, i));
      btn(210, 600, 170, 56, 'START', start);
    } else {
      ctx.font = 'bold 30px monospace'; ctx.fillText('GAME OVER', W / 2, 260);
      ctx.font = '18px monospace'; ctx.fillText('SCORE ' + (score | 0), W / 2, 304);
      ctx.fillStyle = score >= best && score > 0 ? '#ffd060' : '#9ab'; ctx.fillText(score >= best && score > 0 ? 'NEW BEST!' : 'BEST ' + best, W / 2, 334);
      ctx.fillStyle = '#9ab'; ctx.font = '14px monospace'; ctx.fillText('最大 ' + maxChain + ' 連鎖', W / 2, 366);
      btn(210, 600, 170, 56, 'RETRY', start);
    }
  }
}

// ---- 入力 ----
function press(k) {
  if (k === 'rot') rotate(1);
  else if (k === 'rotL') rotate(-1);
  else if (k === 'down') hold.down.on = true;
  else { const h = hold[k]; if (!h.on) { h.on = true; h.t = 0; h.n = 0.17; move(k === 'left' ? -1 : 1); } }
}
function release(k) { if (k === 'down') hold.down.on = false; else if (hold[k]) hold[k].on = false; }
const ptrs = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (state !== 'play') { for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; } return; }
  for (const b of CTRL) if (x >= b.x && x <= b.x + 92 && y >= 626) { ptrs.set(e.pointerId, b.k); press(b.k); try { cv.setPointerCapture(e.pointerId); } catch (err) {} return; }
  if (y < 626) rotate(1);                                       // 盤面タップでも回転
});
function up(e) { const k = ptrs.get(e.pointerId); if (k) { release(k); ptrs.delete(e.pointerId); } }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rot', KeyX: 'rot', Space: 'rot', KeyZ: 'rotL' };
window.addEventListener('keydown', e => {
  if (e.code === 'Enter' && state !== 'play') { initAudio(); start(); return; }
  const k = KEYS[e.code]; if (!k) return; e.preventDefault(); initAudio();
  if (state !== 'play') { if (e.code === 'Space') start(); return; }
  if (!e.repeat) press(k);
});
window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) release(k); });
let last = 0;
function frame(t) { update((t - last) / 1000 || 0); last = t; draw(); requestAnimationFrame(frame); }
grid = emptyGrid(); offs = zeroOffs(); queue = [pair(), pair()]; score = 0; popped = 0; maxChain = 0;
requestAnimationFrame(frame);

// テスト用
window.__game = {
  get state() { return state; }, get score() { return score; }, get phase() { return phase; }, get maxChain() { return maxChain; },
  start() { seed = 1; begin(); },
  step(n) { for (let i = 0; i < n; i++) update(1 / 60); },
  // rows: 見える12段を上から並べた文字列配列(6文字、'.'=空、'0'〜'3'=色)。置いたあと連鎖を最後まで解決し、{score, maxChain} を返す
  resolve(rows) {
    seed = 1; begin(); grid = emptyGrid(); offs = zeroOffs();
    rows.forEach((s, i) => { for (let c = 0; c < COLS; c++) grid[i + 1][c] = s[c] === '.' ? -1 : +s[c]; });
    score = 0; startDrop();
    for (let k = 0; k < 60 * 30 && !(phase === 'fall' && state === 'play'); k++) update(1 / 60);
    return { score, maxChain, state };
  },
  // 乱数で置き続ける(回転・移動なしで列を散らす)。終了までのペア数と NaN などの異常を返す
  play(maxPieces) {
    seed = 7; begin(); let n = 0;
    while (state === 'play' && n < (maxPieces || 400)) {
      cur.ax = (rnd() * 5 | 0); cur.o = rnd() < .5 ? 1 : 0; if (!fits(cur.ax, cur.ay, cur.o)) cur.o = 0;
      const id = n; hold.down.on = true;
      for (let k = 0; k < 60 * 30 && state === 'play' && !(phase === 'fall' && n > id); k++) { const before = phase; update(1 / 60); if (before === 'fall' && phase !== 'fall') n++; }
      hold.down.on = false;
    }
    return { state, pieces: n, score, maxChain };
  },
};
</script>
<script src="../assets/back-button.js"></script>
</body>
</html>
