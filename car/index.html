<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ラインロード</title>
<style>
  html,body{margin:0;height:100%;background:#1b2330;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
  #wrap{display:flex;flex-direction:column;height:100%;align-items:center;gap:4px;padding:4px;box-sizing:border-box}
  #mid{flex:1;min-height:0;width:100%;display:flex;gap:10px;align-items:flex-start;justify-content:center}
  #area{flex:none;display:flex}
  #side{display:flex;flex-direction:column;justify-content:flex-start;gap:10px}
  #side button{width:120px;box-sizing:border-box;padding:16px 0;font-size:16px;font-weight:bold;text-align:center}
  canvas{background:#9fd8ff;touch-action:none;border-radius:6px;display:block}
  #bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
  #stages,#worlds{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%;flex-basis:100%}
  #stages button{font-size:12px;padding:4px 0;width:34px;border-radius:5px}
  #worlds button{font-size:12px;padding:4px 8px;border-radius:5px}
  button{font-size:14px;padding:6px 12px;border:0;border-radius:8px;background:#3a8dff;color:#fff}
  button.sub{background:#55627a}
  button.on{background:#ff9a3a}
  #loadout{display:flex;gap:10px;align-items:center;font-size:13px;flex-basis:100%;justify-content:center}
  #pv{border-radius:6px;background:#2b3a52}
  #lo-stats{font-size:12px;line-height:1.5;margin-top:3px;text-align:left}
  select{font-size:13px;padding:4px;border-radius:6px}
  #info{font-size:13px;opacity:.9;flex-basis:100%;text-align:center}
  @media (max-width:700px){
    #wrap{padding-top:44px;overflow-y:auto}
    html,body{touch-action:manipulation}
    #mid{flex-direction:column;align-items:center;flex:none;width:100%}
    #side{flex-direction:row-reverse;width:100%} /* 一番大事なボタン(スタート)は右 */
    #side button{flex:1;width:auto;padding:14px 0}
    #loadout{flex-wrap:wrap}
    #lo-stats{font-size:11px}
    #info{font-size:12px}
  }
</style>
<script src="../assets/audio-unlock.js"></script>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div id="worlds"></div>
    <div id="stages"></div>
    <button id="tool" class="sub" style="display:none">道具: 道</button>
    <button id="spd" class="sub">速度 ×1</button>
    <button id="bgm" class="sub">♪ ON</button>
    <div id="loadout"><canvas id="pv" width="170" height="78"></canvas><div id="lo-r">車 <select id="carSel"></select> タイヤ <select id="tireSel"></select><div id="lo-stats"></div></div></div>
    <span id="info"></span>
  </div>
  <div id="mid">
    <div id="area"><canvas id="c" width="900" height="500"></canvas></div>
    <div id="side">
      <button id="go">スタート</button>
      <button id="reset" class="sub">線をリセット</button>
    </div>
  </div>
</div>
<script>
const W = 900, H = 500, COL = 4, N = W / COL + 1, PIT = H + 300;
let R = 20; // 車の半径(タイヤで変わる)
// ---- 車とタイヤ ----
const CARS = [
  { name: '標準', maxv: 200, accel: 700, mass: 1, jump: 430, body: '#e53935', roof: '#ffcdd2', st: [3, 3, 3, 3], desc: 'バランス型。どの面でも基準になる' },
  { name: 'スポーツ', maxv: 230, accel: 700, mass: 0.7, jump: 430, body: '#2f80ed', roof: '#cfe3ff', st: [5, 3, 1, 3], desc: '速くて軽い。押し合いや風に弱い' },
  { name: 'トラック', maxv: 170, accel: 800, mass: 2.2, jump: 380, body: '#f2a100', roof: '#ffe9b0', st: [1, 4, 5, 2], desc: '重くて遅い。押し合いと風に強く、坂に強い' },
  { name: 'バギー', maxv: 200, accel: 850, mass: 1, jump: 500, body: '#43a047', roof: '#d4efd6', st: [3, 4, 3, 5], desc: '登坂とジャンプが得意。ぴょんぴょん跳ねる' },
];
const TIRES = [
  { name: '標準', r: 20, vmul: 1, amul: 1, ice: false, desc: 'ふつうのタイヤ' },
  { name: '大径', r: 24, vmul: 1, amul: 1, ice: false, desc: '大きいブロックタイヤ。段差と小さな穴に強い' },
  { name: 'スパイク', r: 20, vmul: 1, amul: 0.9, ice: true, desc: '鋲つき。氷の上でも進める。少し加速が弱い' },
  { name: 'スリック', r: 20, vmul: 1.1, amul: 0.7, ice: false, desc: 'つるつる。最高速は上がるが加速が弱い' },
  { name: '炎', r: 20, vmul: 1.05, amul: 1.2, ice: false, desc: '燃えるタイヤ。加速が強く、最高速も少し上がる' },
];
let carSel = 0, tireSel = 0, LD = { maxv: 200, accel: 700, mass: 1, jump: 430, r: 20, ice: false };
try { carSel = Math.min(CARS.length - 1, Math.max(0, +localStorage.getItem('lr_car') || 0)); tireSel = Math.min(TIRES.length - 1, Math.max(0, +localStorage.getItem('lr_tire') || 0)); } catch (e) {}
function loadout() { const c = CARS[carSel], t = TIRES[tireSel]; return { maxv: c.maxv * t.vmul, accel: c.accel * t.amul, mass: c.mass, jump: c.jump, r: t.r, ice: t.ice }; }
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

// 山: 中心c・半幅w・頂上y(base=基準の高さ)。範囲外はbase
const mt = (x, c, w, peak, base = 380) => base - (base - peak) * smooth(1 - Math.abs(x - c) / w);
// 区間指定: [[x0,x1,y],...] 範囲外は def
const spans = (x, list, def) => { for (const [a, b, y] of list) if (x >= a && x < b) return y; return def; };

const STAGES = [
  { name: '1 谷を渡れ', hint: '自走。谷に道を引こう', mode: 'drive', tool: 'road',
    start: { x: 70 }, goal: { x: 830 },
    height: x => (x >= 260 && x <= 640) ? PIT : 320 },
  { name: '2 山を削れ', hint: '重力。鉄(灰色)は削れない。削りすぎに注意', mode: 'gravity', tool: 'carve',
    iron: [{ x0: 480, x1: 560, y0: 215, y1: 420 }],
    start: { x: 110 }, goal: { x: 840 },
    height: x => {
      if (x < 90) return 180;
      if (x < 300) return 180 + 220 * smooth((x - 90) / 210);
      if (x < 520) return 400 - 290 * smooth((x - 340) / 180);
      if (x < 720) return 110 + 290 * smooth((x - 520) / 200);
      return 400;
    } },
  { name: '3 段差', hint: '自走。崖に坂道を架けよう', mode: 'drive', tool: 'road',
    start: { x: 60 }, goal: { x: 840 },
    height: x => spans(x, [[0, 200, 380], [200, 400, 300], [400, 600, 220]], 140) },
  { name: '4 急な山', hint: '自走。中の鉄は削れない。坂を作って登ろう', mode: 'drive', tool: 'carve',

    start: { x: 60 }, goal: { x: 810 },
    height: x => mt(x, 430, 170, 60) },
  { name: '5 滑り台', hint: '重力。落下の勢いで届く滑り台を', mode: 'gravity', tool: 'road',

    height: x => x < 150 ? 130 + 30 * (x / 150) : (x < 450 ? PIT : 300) },

    start: { x: 110 }, goal: { x: 885 },
    height: x => {

      return Math.min(b, mt(x, 420, 100, 330, 400), mt(x, 620, 250, 130, 400));

  // ---- 11〜20: 新ギミック ----

    zones: [{ type: 'bounce', x0: 284, x1: 324, y0: 343, y1: 363, v: 650 }],

    area: [{ x0: 300, y0: 290, x1: 500, y1: 400 }],

    pipes: [{ x0: 330, x1: 370, y0: 260, y1: 600 }, { x0: 560, x1: 600, y0: 250, y1: 600 }],
    height: x => ((x >= 200 && x < 270) || (x >= 420 && x < 490)) ? PIT : 340 },
  { name: '14 パトロール', hint: '自走。地面を掘って、往復する壁の下をくぐろう', mode: 'drive', tool: 'carve',

  { name: '18 島ジャンプ', hint: 'ジャンプ車。パッドの加速でも届かない。足場を置こう', mode: 'jump', tool: 'road',
    area: [{ x0: 520, y0: 330, x1: 740, y1: 400 }],

    movers: [{ x: 400, y: 260, w: 60, h: 100, ax: 120, ay: 0, per: 4, ph: 1 }],

  { name: '20 ギミックの壁', hint: '自走。地面を掘って、往復する壁の下をくぐろう', mode: 'drive', tool: 'carve', start: { x: 40 }, goal: { x: 850 },
    area: [{ x0: 255, y0: 356, x1: 813, y1: 446 }],
    movers: [{ x: 499, y: 278, w: 70, h: 88, ax: 154, ay: 0, per: 5, ph: 0 }],
    height: () => 366 },

  // ---- ワールド3: 砂漠 (21〜30) ----
  { name: '21 流砂', hint: '自走。流砂は進めない。上を渡る橋を引こう', mode: 'drive', tool: 'road',
    start: { x: 50 }, goal: { x: 840 },
    zones: [{ type: 'sand', x0: 250, x1: 560, y0: 300, y1: 420 }],
    height: () => 380 },
  { name: '22 追い風', hint: '重力。風に乗ってゴールの高台へ', mode: 'gravity', tool: 'road',
    start: { x: 50 }, goal: { x: 830 },
    zones: [{ type: 'wind', x0: 140, x1: 700, y0: 0, y1: 600, fx: 450 }],
    height: x => x < 150 ? 150 + 25 * (x / 150) : (x < 700 ? PIT : 95) },
  { name: '23 風車', hint: '自走。風車の上昇気流で高台に登ろう', mode: 'drive', tool: 'road',
    area: [{ x0: 120, y0: 330, x1: 320, y1: 400 }],
    start: { x: 50 }, goal: { x: 800 },
    zones: [{ type: 'fan', x0: 290, x1: 450, y0: 170, y1: 420, fy: -1700 }],
    height: x => (x >= 200 && x < 280) ? PIT : (x < 450 ? 380 : 200) },
  { name: '24 ベルトコンベア', hint: '重力。ベルトが運んでくれる。間の穴に橋を', mode: 'gravity', tool: 'road',
    start: { x: 50 }, goal: { x: 850 },
    zones: [{ type: 'belt', x0: 20, x1: 300, y0: 300, y1: 420, bs: 250 }, { type: 'belt', x0: 480, x1: 720, y0: 300, y1: 420, bs: 250 }],
    height: x => (x >= 300 && x < 480) ? PIT : 380 },
  { name: '25 爆発岩', hint: '重力。勢いがあれば爆発岩は壊せる(壊すと減速)。鉄は削れない', mode: 'gravity', tool: 'carve',
    start: { x: 80 }, goal: { x: 860 },
    iron: [{ x0: 510, x1: 610, y0: 300, y1: 420 }],
    breaks: [{ x0: 330, x1: 370, y0: 300, y1: 420, need: 380 }],
    height: x => { const b = x < 60 ? 100 : x < 300 ? 100 + 300 * smooth((x - 60) / 240) : 400; return Math.min(b, mt(x, 560, 140, 170, 400)); } },

    height: x => Math.min(mt(x, 200, 110, 180), mt(x, 450, 110, 120), mt(x, 700, 110, 180)) },

function speak(text) {
  try {
    if (typeof speechSynthesis === 'undefined') return;
    speechSynthesis.cancel();
    if (!bgmOn || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.05; u.volume = 1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

      if (z.bolt) { if (zoneOn(z) && state === 'run' || state !== 'run') { ctx.strokeStyle = 'rgba(255,240,120,.9)'; ctx.lineWidth = 4; ctx.beginPath(); for (let x = z.x0 + 10; x < z.x1; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x + 8, 120); ctx.lineTo(x - 6, 200); ctx.lineTo(x + 6, z.y1); } ctx.stroke(); } }
      else { ctx.fillStyle = '#e8451a'; ctx.fillRect(z.x0, yy, w, z.y1 - yy + 20); ctx.fillStyle = '#ffb347'; ctx.beginPath(); for (let x = z.x0; x <= z.x1; x += 8) ctx.lineTo(x, yy + Math.sin(tt * 3 + x * .1) * 3); ctx.lineTo(z.x1, yy + 12); ctx.lineTo(z.x0, yy + 12); ctx.fill(); }
    } else if (z.type === 'pull') {
      ctx.strokeStyle = z.k < 0 ? 'rgba(255,120,120,.7)' : 'rgba(90,60,160,.7)'; ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); for (let a2 = 0; a2 < 5.5; a2 += .2) { const rr = z.rad * (0.25 + i * .2) * (1 - a2 / 14), ang = a2 + tt * 2 * (z.k < 0 ? -1 : 1) + i * 1.5; ctx.lineTo(z.cx + Math.cos(ang) * rr, z.cy + Math.sin(ang) * rr); } ctx.stroke(); }
    } else if (z.type === 'water') {
      ctx.fillStyle = 'rgba(40,120,220,.4)'; ctx.fillRect(z.x0, z.y0, w, h); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); for (let x = z.x0; x <= z.x1; x += 8) ctx.lineTo(x, z.y0 + 3 + Math.sin(tt * 3 + x * .07) * 3); ctx.stroke();
    } else if (z.type === 'gravity') {
      ctx.fillStyle = 'rgba(150,100,255,.18)'; ctx.fillRect(z.x0, z.y0, w, h); ctx.fillStyle = 'rgba(220,200,255,.8)';
      for (let i = 0; i < 12; i++) { const ph = (tt * .4 + i * .31) % 1; ctx.beginPath(); ctx.arc(z.x0 + (i * 67) % w, z.y1 - ph * h, 3, 0, 7); ctx.fill(); }
    } else if (z.type === 'bounce') {
      ctx.fillStyle = '#e53935'; ctx.fillRect(z.x0, z.y0, w, 8); ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
      ctx.beginPath(); for (let x = z.x0 + 6; x < z.x1; x += 12) { ctx.moveTo(x, z.y0 + 8); ctx.lineTo(x + 6, z.y0 + 18); ctx.lineTo(x - 0, z.y0 + 28); } ctx.stroke();
    } else if (z.type === 'belt') {
      ctx.fillStyle = 'rgba(40,40,40,.6)'; ctx.fillRect(z.x0, z.y1 - 36, w, 12);
      ctx.fillStyle = '#ffd24d'; const o = (tt * z.bs * 0.5) % 24;
      for (let x = z.x0 - 24 + (o + 24) % 24; x < z.x1; x += 24) { ctx.beginPath(); ctx.moveTo(x, z.y1 - 36); ctx.lineTo(x + 8 * Math.sign(z.bs), z.y1 - 30); ctx.lineTo(x, z.y1 - 24); ctx.fill(); }
    } else if (on) { // 風・風車
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      const dx = Math.sign(z.fx || 0), dy = Math.sign(z.fy || 0);
      for (let i = 0; i < 14; i++) {
        const ph = (tt * 0.9 + i * 0.37) % 1, sx = z.x0 + (i * 71) % w, sy = z.y0 + (i * 47) % h;
        const px = sx + dx * ph * 120, py = sy + dy * ph * 120;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + dx * 26, py + dy * 26); ctx.stroke();
      }
    }
    ctx.restore();
    if (z.type === 'fan') { // 風車の羽根
      const cx = (z.x0 + z.x1) / 2, cy = z.y1 - 8;
      ctx.fillStyle = '#666'; ctx.fillRect(cx - 4, cy - 30, 8, 38);
      ctx.save(); ctx.translate(cx, cy - 30); ctx.rotate(tt * 6); ctx.fillStyle = '#eee';
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillRect(-4, -34, 8, 34); }
      ctx.restore();
    }
  });
  (STAGES[stage].breaks || []).forEach((b, i) => {
    if (broken[i]) return;
    ctx.fillStyle = b.hot ? '#bfe6ff' : '#b5651d'; ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.strokeStyle = b.hot ? '#5aa9d6' : '#6b3a10'; ctx.lineWidth = 3; ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.fillStyle = '#ff5a36'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(b.hot ? '🧊' : '💥', (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2 + 6); ctx.textAlign = 'left';
  });
  for (const b of STAGES[stage].pipes || []) {
    if (b.cactus) {
      const cw = b.x1 - b.x0, mx = (b.x0 + b.x1) / 2, top = b.y0, bot = Math.min(b.y1, H);
      ctx.fillStyle = '#3f9a4a'; ctx.fillRect(b.x0 + cw * 0.2, top, cw * 0.6, bot - top);
      ctx.fillRect(b.x0 - 6, top + (bot - top) * 0.3, 8, 6); ctx.fillRect(b.x0 - 6, top + (bot - top) * 0.15, 6, (bot - top) * 0.2);
      ctx.fillStyle = '#e8f5d0'; for (let y = top + 8; y < Math.min(bot, H) - 6; y += 16) { ctx.fillRect(mx - 9, y, 3, 3); ctx.fillRect(mx + 6, y + 6, 3, 3); }
      continue;
    }
    ctx.fillStyle = '#2e9e4f'; ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, Math.min(b.y1, H) - b.y0);
    ctx.fillStyle = '#1f7a3a'; ctx.fillRect(b.x0 - 5, b.y0, b.x1 - b.x0 + 10, 16);
    ctx.fillStyle = '#7ee09a'; ctx.fillRect(b.x0 + 5, b.y0 + 16, 5, Math.min(b.y1, H) - b.y0 - 16);
  }
  ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); for (const r of roads) { ctx.moveTo(r.ax, r.ay); ctx.lineTo(r.bx, r.by); } ctx.stroke();
  for (const m of STAGES[stage].movers || []) {
    const q = moverNow(m, state === 'run' ? t0 : 0);
    ctx.fillStyle = '#f5a623'; ctx.fillRect(q.x, q.y, q.w, q.h);
    ctx.fillStyle = '#222';
    for (let xx = q.x - q.h; xx < q.x + q.w; xx += 24) { ctx.beginPath(); ctx.moveTo(Math.max(xx, q.x), q.y + q.h); ctx.lineTo(Math.max(xx + 12, q.x), q.y + q.h); ctx.lineTo(Math.min(xx + q.h + 12, q.x + q.w), q.y); ctx.lineTo(Math.min(xx + q.h, q.x + q.w), q.y); ctx.fill(); }
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.strokeRect(q.x, q.y, q.w, q.h);
  }
  for (const q of rockQ) if (!q.done) { ctx.save(); ctx.translate(q.x, q.y); drawRock(q.r, 0); ctx.restore(); }
  for (const q of rocks) { ctx.save(); ctx.translate(q.x, q.y); drawRock(q.r, q.rot); ctx.restore(); }
  drawExtras();
  for (const p of pads) {
    ctx.globalAlpha = p.hit ? 0.3 : 1; ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(p.px, p.py, 24, 0, 7); ctx.fill();
    ctx.strokeStyle = '#d17b00'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
    for (const dx of [-8, 4]) { ctx.beginPath(); ctx.moveTo(p.px + dx, p.py - 11); ctx.lineTo(p.px + dx + 10, p.py); ctx.lineTo(p.px + dx, p.py + 11); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // goal / start
  const g = STAGES[stage].goal, gy = groundY(g.x);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(g.x, gy); ctx.lineTo(g.x, gy - 60); ctx.stroke();
  ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(g.x, gy - 60); ctx.lineTo(g.x + 32, gy - 50); ctx.lineTo(g.x, gy - 40); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText('GOAL', g.x - 14, gy - 66);
  const ar = STAGES[stage].area;
  if (ar) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H);
    for (const r of ar) ctx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    ctx.fillStyle = 'rgba(20,30,50,.28)'; ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    for (const r of ar) { ctx.strokeStyle = r.tool === 'carve' ? 'rgba(255,190,120,.95)' : r.tool === 'road' ? 'rgba(170,220,255,.95)' : 'rgba(255,255,255,.85)'; ctx.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0); }
    ctx.restore();
  }
  // car
  ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(angle);
  const spd = Math.hypot(car.vx, car.vy);
  if (state === 'run' && spd > 230) { // スピード線
    ctx.restore(); ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    const ux = car.vx / spd, uy = car.vy / spd;
    for (let k = 0; k < 4; k++) { const off = (k - 1.5) * 9, bx = car.x - ux * 34 - uy * off, by = car.y - uy * 34 + ux * off; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - ux * (22 + k * 5), by - uy * (22 + k * 5)); ctx.stroke(); }
    ctx.restore(); ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(angle);
  }
  drawCarSprite(ctx, carSel, tireSel, R, state === 'run' ? t0 : performance.now() / 1000, car.x / (13 * R / 20), spd > 230);
  ctx.restore();
  if (state === 'clear' || state === 'fail') {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, H / 2 - 40, W, 80);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(state === 'clear' ? 'CLEAR!' : 'FAILED', W / 2, H / 2 + 12); ctx.textAlign = 'left';
  }
}
let last = performance.now();
// 物理は固定時間刻み(1/60秒)。画面のリフレッシュレートや速度ボタンで結果が変わらないようにする
const STEP = 1 / 60;
let acc = 0;
function loop(now) {
  acc += Math.min(0.1, Math.max(0, (now - last) / 1000)) * speed; last = now;
  let n = 0;
  while (acc >= STEP && n < speed * 6 + 6) { update(STEP); acc -= STEP; n++; }
  if (n >= speed * 6 + 6) acc = 0; // 処理が追いつかないときは捨てる(結果は変わらない)
  render(); drawPreview(); requestAnimationFrame(loop);
}
function fit() {
  const a = $('mid').getBoundingClientRect(), narrow = innerWidth <= 700;
  const aw = narrow ? a.width : a.width - $('side').offsetWidth - 10, k = narrow ? Math.min(aw / W, 1.2) : Math.min(aw / W, a.height / H);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit);
loadStage(0);
fit(); setTimeout(fit, 100);
requestAnimationFrame(loop);
</script>
