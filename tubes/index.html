<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Color Tubes - 試験管カラーソート</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; background: #05060f; color: #cde; font-family: monospace; }
  body { height: 100dvh; padding: 44px 6px 4px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #000; border: 2px solid #335; aspect-ratio: 400 / 700; height: auto;
           width: min(100%, calc((100dvh - 44px - 30px) * 0.5714)); touch-action: none; }
  p { margin: 4px; font-size: 11px; line-height: 1.4; opacity: .8; text-align: center; }
  @media (max-width: 700px) { p.pc { display: none; } }
</style>
<script src="../assets/audio-unlock.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<p class="pc">クリック: 試験管を選ぶ→注ぐ先 　Z: 戻す 　R: やり直し 　H: ヒント 　M: 音 　Enter: スタート/次へ</p>
<script>
// ======================= 基本 =======================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 400, H = 700, DPR = Math.min(2, window.devicePixelRatio || 1), STEP = 1 / 60;
cv.width = W * DPR; cv.height = H * DPR;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const KEY_BEST = 'tubesBest', KEY_CUR = 'tubesCur', MAX_STAGE = 99;
let best = parseInt(lsGet(KEY_BEST) || '0', 10) || 0;
let stage = Math.max(1, Math.min(best + 1, parseInt(lsGet(KEY_CUR) || '1', 10) || 1));

// ======================= 音 =======================
let actx = null, muted = lsGet('tubesMute') === '1';
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
}
function tone(f, d, type, v, slide, delay) {
  if (muted || !actx) return;
  const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  pick() { tone(660, 0.06, 'triangle', 0.06); },
  bad() { tone(160, 0.12, 'square', 0.05, -40); },
  pour(n) { for (let i = 0; i < n; i++) tone(380 + i * 90, 0.12, 'sine', 0.06, 160, i * 0.06); },
  done() { [784, 988, 1175].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, 0, i * 0.06)); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'triangle', 0.07, 0, i * 0.09)); },
  ui() { tone(520, 0.04, 'square', 0.03); },
};

// ======================= 描画ヘルパ =======================
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, col, align, bold) {
  ctx.font = (bold === false ? '' : 'bold ') + size + 'px monospace';
  ctx.fillStyle = col || '#cde'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
let buttons = [];
function btn(x, y, w, h, label, fn, o) {
  o = o || {};
  ctx.globalAlpha = o.disabled ? .35 : 1;
  ctx.fillStyle = o.primary ? '#3a6ae0' : 'rgba(28,36,78,.92)'; rr(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = o.primary ? '#9ab8ff' : '#4a62a8'; ctx.lineWidth = 1.5; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + 1, o.size || 14, '#fff', 'center');
  ctx.globalAlpha = 1;
  if (!o.disabled) buttons.push({ x, y, w, h, fn });
}
const BG = document.createElement('canvas'); BG.width = W; BG.height = H;
(function () {
  const g = BG.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0b0c26'); grd.addColorStop(1, '#1d1240'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.2 + rnd() * .5) + ')'; g.fillRect(rnd() * W, rnd() * H, 1.3, 1.3); }
})();

// ======================= 盤面ロジック =======================
const CAP = 4;
const PAL = ['#ff4d5e', '#3d8bff', '#4fd65a', '#ffd23f', '#b15cff', '#ff9a2e', '#2fe0d0', '#ff6fc0', '#9a6b43', '#c4c8d4', '#1f3fae', '#a8ff3a'];
const MARK = ['●', '▲', '■', '◆', '★', '✚', '♥', '♣', '▼', '◎', '♠', '✿'];   // 色覚サポートの記号
function rng(seed) {
  return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const nColors = s => Math.min(11, 2 + Math.ceil(s / 2));
const topC = a => a[a.length - 1];
function runLen(a) { let k = 1; while (k < a.length && a[a.length - 1 - k] === topC(a)) k++; return k; }
const isDone = a => a.length === CAP && a.every(x => x === a[0]);
const solved = t => t.every(a => !a.length || isDone(a));
function canPour(t, i, j) {
  const a = t[i], b = t[j];
  if (i === j || !a.length || b.length >= CAP || isDone(a)) return false;
  return !b.length || topC(b) === topC(a);
}
function pour(t, i, j) { const n = Math.min(runLen(t[i]), CAP - t[j].length); for (let k = 0; k < n; k++) t[j].push(t[i].pop()); return n; }
const keyOf = t => t.map(a => String.fromCharCode.apply(null, a.map(c => 97 + c))).sort().join('|');
// 深さ優先 + 訪問済み集合。戻り値 { path } / { stuck } / { gaveUp }
function solve(start, limit) {
  const t = start.map(a => a.slice()), seen = new Set(), path = [];
  let nodes = 0;
  function dfs() {
    if (solved(t)) return true;
    if (++nodes > limit) return false;
    const k = keyOf(t); if (seen.has(k)) return false; seen.add(k);
    for (let pass = 0; pass < 2; pass++) {          // 同色の上に注ぐ手を先に、空の管への手を後に
      for (let i = 0; i < t.length; i++) {
        let emptyTried = false;
        for (let j = 0; j < t.length; j++) {
          if (!canPour(t, i, j)) continue;
          const toEmpty = !t[j].length;
          if ((pass === 0) === toEmpty) continue;
          if (toEmpty) { if (emptyTried || runLen(t[i]) === t[i].length) continue; emptyTried = true; }
          const n = pour(t, i, j); path.push([i, j]);
          if (dfs()) return true;
          path.pop(); for (let q = 0; q < n; q++) t[i].push(t[j].pop());
        }
      }
    }
    return false;
  }
  if (dfs()) return { path: path.slice() };
  return nodes > limit ? { gaveUp: true } : { stuck: true };
}
function genStage(s) {
  const r = rng(s * 7919 + 13), n = nColors(s);
  let last = null;
  for (let tries = 0; tries < 60; tries++) {
    const pool = [];
    for (let c = 0; c < n; c++) for (let k = 0; k < CAP; k++) pool.push(c);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const t = [];
    for (let i = 0; i < n; i++) t.push(pool.slice(i * CAP, i * CAP + CAP));
    t.push([], []);
    last = t;
    if (t.some(isDone)) continue;
    if (t.some(a => runLen(a) >= 3)) continue;            // 最初からほぼ揃っている管は避ける
    if (solve(t, 60000).path) return t;
  }
  return last;
}

// ======================= 状態 =======================
let state = 'title';     // title / play / clear
let tubes = [], hist = [], sel = -1, moves = 0, extraUsed = false, anim = null, hint = null, toast = null, shake = null;
let clearT = 0, sparks = [];
function loadStage() {
  tubes = genStage(stage); hist = []; sel = -1; moves = 0; extraUsed = false; anim = null; hint = null; toast = null; sparks = [];
  lsSet(KEY_CUR, String(stage));
}
function start() { initAudio(); loadStage(); state = 'play'; }

// ======================= レイアウト =======================
const TW = 40, SEG = 30, TH = CAP * SEG + 22;
function layout() {
  const n = tubes.length, rows = n <= 6 ? 1 : 2, per = Math.ceil(n / rows), out = [];
  const gap = Math.min(66, (W - 24) / per);
  const y0 = rows === 1 ? 260 : 150;
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / per), inRow = row === rows - 1 ? n - per * (rows - 1) : per, col = i - row * per;
    out.push({ x: W / 2 + (col - (inRow - 1) / 2) * gap, y: y0 + row * (TH + 70) });
  }
  return out;
}
function tubePath(x, y) {   // x: 中心, y: 口の上端
  const l = x - TW / 2, r = x + TW / 2, b = y + TH, rad = TW / 2;
  ctx.beginPath(); ctx.moveTo(l, y); ctx.lineTo(l, b - rad); ctx.arc(x, b - rad, rad, Math.PI, 0, true); ctx.lineTo(r, y);
}
function drawTube(x, y, a, opt) {
  opt = opt || {};
  ctx.save();
  if (opt.rot) { ctx.translate(x, y); ctx.rotate(opt.rot); ctx.translate(-x, -y); }
  if (opt.glow) { ctx.shadowColor = opt.glow; ctx.shadowBlur = 18; }
  tubePath(x, y); ctx.fillStyle = 'rgba(170,200,255,.08)'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save(); tubePath(x, y); ctx.clip();
  const bottom = y + TH - 3;
  a.forEach((c, k) => {
    const yy = bottom - (k + 1) * SEG;
    const g = ctx.createLinearGradient(x - TW / 2, 0, x + TW / 2, 0);
    g.addColorStop(0, PAL[c]); g.addColorStop(.35, '#ffffff55'); g.addColorStop(.45, PAL[c]); g.addColorStop(1, PAL[c]);
    ctx.fillStyle = PAL[c]; ctx.fillRect(x - TW / 2, yy, TW, SEG + (k === 0 ? 4 : .5));
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x - TW / 2 + 6, yy, 5, SEG);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.font = '13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(MARK[c], x + 3, yy + SEG / 2 + 1);
  });
  ctx.restore();
  tubePath(x, y); ctx.strokeStyle = opt.sel ? '#fff' : 'rgba(200,220,255,.75)'; ctx.lineWidth = opt.sel ? 3 : 2; ctx.stroke();
  ctx.fillStyle = 'rgba(200,220,255,.75)'; rr(x - TW / 2 - 4, y - 4, TW + 8, 6, 3); ctx.fill();
  if (isDone(a)) { ctx.fillStyle = '#c08a4a'; rr(x - TW / 2 + 3, y - 14, TW - 6, 14, 3); ctx.fill(); ctx.strokeStyle = '#7a4f22'; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}

// ======================= 操作 =======================
function tapTube(i) {
  if (anim || state !== 'play') return;
  hint = null;
  if (sel < 0) {
    if (tubes[i].length && !isDone(tubes[i])) { sel = i; sfx.pick(); }
    return;
  }
  if (sel === i) { sel = -1; return; }
  if (canPour(tubes, sel, i)) { anim = { from: sel, to: i, t: 0, applied: false, n: 0 }; sel = -1; return; }
  if (tubes[i].length && !isDone(tubes[i])) { sel = i; sfx.pick(); return; }
  sfx.bad(); shake = { i: sel, t: 0 }; sel = -1;
}
function undo() {
  if (anim || state !== 'play' || !hist.length) return;
  tubes = hist.pop(); moves = Math.max(0, moves - 1); sel = -1; hint = null; sfx.ui();
}
function retry() { if (anim) return; loadStage(); state = 'play'; sfx.ui(); }
function addTube() {
  if (anim || extraUsed || state !== 'play') return;
  extraUsed = true; tubes.push([]); hist.forEach(h => h.push([])); sel = -1; hint = null; sfx.ui();
}
function showHint() {
  if (anim || state !== 'play') return;
  const r = solve(tubes, 80000);
  if (r.path && r.path.length) { hint = { from: r.path[0][0], to: r.path[0][1] }; sfx.ui(); }
  else toast = { txt: r.stuck ? '詰みです。戻すか、試験管を追加しよう' : 'ヒントが見つかりませんでした', life: 150 };
}
function nextStage() { stage = Math.min(MAX_STAGE, stage + 1); start(); }

// ======================= 更新 =======================
function update() {
  if (anim) {
    anim.t += STEP / 0.5;
    if (!anim.applied && anim.t >= 0.5) {
      hist.push(tubes.map(a => a.slice())); if (hist.length > 200) hist.shift();
      anim.n = pour(tubes, anim.from, anim.to); anim.color = topC(tubes[anim.to]); anim.applied = true; moves++;
      sfx.pour(anim.n);
      if (isDone(tubes[anim.to])) {
        sfx.done(); const L = layout()[anim.to];
        for (let k = 0; k < 18; k++) { const a = Math.random() * 7, v = 1 + Math.random() * 2.5; sparks.push({ x: L.x, y: L.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, life: 40, col: PAL[tubes[anim.to][0]] }); }
      }
    }
    if (anim.t >= 1) {
      anim = null;
      if (solved(tubes)) {
        state = 'clear'; clearT = 0; sfx.clear();
        if (stage > best) { best = stage; lsSet(KEY_BEST, String(best)); }
      }
    }
  }
  if (shake && (shake.t += STEP) > .3) shake = null;
  if (state === 'clear') clearT++;
  sparks.forEach(p => { p.vy += .12; p.x += p.vx; p.y += p.vy; p.life--; }); sparks = sparks.filter(p => p.life > 0);
  if (toast && --toast.life <= 0) toast = null;
}

// ======================= 描画 =======================
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buttons = [];
  ctx.drawImage(BG, 0, 0);
  // HUD
  ctx.fillStyle = 'rgba(8,10,30,.85)'; ctx.fillRect(0, 0, W, 50);
  text('STAGE ' + stage, W / 2, 18, 18, '#fff', 'center');
  text(nColors(stage) + '色  手数 ' + moves, W / 2, 38, 11, '#9ab', 'center', false);
  text('BEST ' + best, 10, 25, 11, '#9ab', 'left', false);
  btn(W - 46, 8, 38, 34, muted ? '🔇' : '🔊', () => { muted = !muted; lsSet('tubesMute', muted ? '1' : '0'); }, { size: 16 });

  if (state !== 'title') {
    const L = layout();
    tubes.forEach((a, i) => {
      if (anim && anim.from === i) return;
      let x = L[i].x, y = L[i].y;
      if (sel === i) y -= 22;
      if (shake && shake.i === i) x += Math.sin(shake.t * 60) * 5;
      const hl = hint && (hint.from === i || hint.to === i);
      drawTube(x, y, a, { sel: sel === i, glow: hl ? '#ffe27a' : (isDone(a) ? 'rgba(120,255,170,.6)' : null) });
      if (hl) text(hint.from === i ? '↑ここから' : '↓ここへ', x, y + TH + 20, 11, '#ffe27a', 'center');
    });
    if (anim) {   // 持ち上げ→傾けて注ぐ→戻す
      const s = L[anim.from], d = L[anim.to], dir = d.x >= s.x ? 1 : -1;
      const tx = d.x - dir * 34, ty = d.y - 70;
      const k = anim.t < .3 ? anim.t / .3 : anim.t > .7 ? (1 - anim.t) / .3 : 1, e = k * k * (3 - 2 * k);
      const x = s.x + (tx - s.x) * e, y = s.y + (ty - s.y) * e, rot = dir * 1.25 * e;
      drawTube(x, y, tubes[anim.from], { rot });
      if (anim.t > .3 && anim.t < .72) {
        const c = anim.applied ? anim.color : topC(tubes[anim.from]);
        const mx = x + Math.cos(rot) * (dir * TW / 2), my = y + Math.sin(rot) * (dir * TW / 2);
        ctx.strokeStyle = PAL[c]; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(d.x, d.y + TH - 10 - tubes[anim.to].length * SEG); ctx.stroke();
      }
    }
    // 下部ボタン(主操作の「戻す」は右端)
    const by = 636, bh = 50;
    btn(8, by, 88, bh, '↻ 最初から', retry, { size: 12 });
    btn(102, by, 88, bh, '+1本', addTube, { size: 13, disabled: extraUsed || state !== 'play' });
    btn(196, by, 88, bh, '💡ヒント', showHint, { size: 13, disabled: state !== 'play' });
    btn(290, by, 102, bh, '↶ 戻す', undo, { primary: true, size: 16, disabled: !hist.length || state !== 'play' });
  }
  sparks.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
  ctx.globalAlpha = 1;
  if (toast) { ctx.globalAlpha = Math.min(1, toast.life / 30); ctx.fillStyle = 'rgba(10,12,30,.92)'; rr(30, 570, W - 60, 40, 10); ctx.fill(); text(toast.txt, W / 2, 590, 12, '#ffe27a', 'center'); ctx.globalAlpha = 1; }

  if (state === 'title') titleScreen();
  else if (state === 'clear' && clearT > 30) {
    panel('CLEAR!', ['STAGE ' + stage + '  手数 ' + moves]);
    btn(40, 430, 140, 56, 'もう一度', retry);
    if (stage < MAX_STAGE) btn(220, 430, 140, 56, '次へ ▶', nextStage, { primary: true, size: 18 });
  }
}
function panel(title, lines) {
  ctx.fillStyle = 'rgba(5,6,15,.8)'; ctx.fillRect(0, 50, W, H - 50);
  text(title, W / 2, 200, 40, '#ffe27a', 'center');
  lines.forEach((l, i) => text(l, W / 2, 262 + i * 26, 14, '#cde', 'center', false));
}
function titleScreen() {
  panel('COLOR TUBES', ['試験管をタップして選び、', '注ぐ先の試験管をタップ。', '一番上の色は「同じ色の上」か', '「空の試験管」にだけ注げる。', '全部の試験管を1色ずつにそろえよう!']);
  btn(40, 440, 54, 54, '◀', () => { if (stage > 1) { stage--; sfx.ui(); } }, { size: 20, disabled: stage <= 1 });
  text('STAGE ' + stage, 147, 467, 16, '#fff', 'center');
  btn(200, 440, 54, 54, '▶', () => { if (stage < Math.min(MAX_STAGE, best + 1)) { stage++; sfx.ui(); } }, { size: 20, disabled: stage >= Math.min(MAX_STAGE, best + 1) });
  btn(266, 432, 110, 70, 'START', start, { primary: true, size: 20 });
}

// ======================= 入力 =======================
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = pos(e);
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; } }
  if (state !== 'play') return;
  const L = layout();
  for (let i = 0; i < L.length; i++) {
    const t = L[i], yo = sel === i ? -22 : 0;
    if (Math.abs(p.x - t.x) < Math.min(32, (L.length > 1 ? Math.abs(L[1].x - L[0].x) || 66 : 66) / 2) && p.y > t.y + yo - 30 && p.y < t.y + yo + TH + 14) { tapTube(i); return; }
  }
  sel = -1;
});
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if (k === 'enter') { if (state === 'title') start(); else if (state === 'clear') nextStage(); }
  else if (k === 'z') undo();
  else if (k === 'r' && state !== 'title') retry();
  else if (k === 'h') showHint();
  else if (k === 'm') { muted = !muted; lsSet('tubesMute', muted ? '1' : '0'); }
});

// ======================= ループ =======================
let last = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  acc += Math.min(.1, (t - last) / 1000); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
}
requestAnimationFrame(t => { last = t; frame(t); });
window.__game = { get state() { return state; }, get tubes() { return tubes; }, solve, genStage, setStage(s) { stage = s; } };
</script>
<script src="../assets/back-button.js"></script>
</body>
</html>
